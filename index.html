<!doctype html>
<html lang="zh-Hant">
<head>

<style>
:root{--bg:#0e1528;--panel:#1d2c4a;--line:#0a1020;--hi:#3f5a88;--text:#fff3d5;--muted:#b9c8e6;--gold:#f2c55c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:9px;
 padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 12px);
 background:linear-gradient(#1b2a48,#111a30)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:20px;letter-spacing:1px;white-space:nowrap}
.ver{font-size:10px;color:var(--muted);letter-spacing:2px}
.coin{display:flex;align-items:center;gap:6px;background:var(--line);border:2px solid var(--hi);padding:5px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.tip{background:#2b3f66;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #5a76a8;padding:8px 34px 8px 10px;font-size:12.5px;line-height:1.45;position:relative}
.tip button{position:absolute;right:4px;top:4px;background:none;border:0;font-size:16px;padding:4px 8px}
.warn{background:#5a2232;box-shadow:inset 0 0 0 2px #c0465a}
.stagewrap{position:relative;border:3px solid var(--line);box-shadow:0 0 0 2px var(--hi),0 5px 0 2px #000c}
#scene{display:block;width:100%;aspect-ratio:128/112;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer;background:#6fb8e8}
#bubble{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:90%;width:max-content;background:#fff9e8;color:#273753;border:3px solid #273753;box-shadow:3px 3px 0 #0006;padding:5px 10px;font-size:14px;font-weight:700;text-align:center;line-height:1.35;transition:opacity .25s;pointer-events:none}
#bubble.off{opacity:0}
.nameplate{text-align:center;line-height:1.25}
#petname{font-size:20px;font-weight:900}
#stageText{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 0 0 2px var(--hi);padding:6px 9px 8px}
.sh{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;margin-bottom:4px}
.sh .v{margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:12px;background:#0a1020;border:2px solid #0a1020}
.bar i{display:block;height:100%;transition:width .4s steps(6);box-shadow:inset 0 3px 0 #ffffff55}
.stat.low{animation:low 1s steps(2) infinite}
@keyframes low{50%{box-shadow:inset 0 0 0 2px #ff5a6a}}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{appearance:none;-webkit-appearance:none;border:3px solid var(--line);background:#e8c98c;color:#3a2a2a;border-radius:0;
 box-shadow:inset 0 -5px 0 #b88a52,inset 0 3px 0 #fff3c0;padding:8px 2px 11px;font-size:14px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:70px}
.act:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #b88a52,inset 0 3px 0 #fff3c0}
.act:disabled{filter:grayscale(.85) brightness(.7)}
.act.on{background:#a9c6f0;box-shadow:inset 0 -5px 0 #5f82b8,inset 0 3px 0 #e4efff}
canvas.picon{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 0 0 2px var(--hi);padding:9px 11px;font-size:13px}
.xph{display:flex;justify-content:space-between;font-weight:700}
.xpbar{height:10px;background:#0a1020;margin-top:6px}
.xpbar i{display:block;height:100%;background:var(--gold);transition:width .4s;box-shadow:inset 0 3px 0 #fff6}
#log{margin:7px 0 0;color:#d8e5f8;min-height:1.4em}
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.toolbar.three{grid-template-columns:repeat(3,1fr)}.tool.big{background:#5a3f78;box-shadow:inset 0 0 0 2px #8a6ab0;font-size:14px;padding:11px 2px}
#battle{position:fixed;inset:0;z-index:15;background:#0e1528;overflow:auto;-webkit-overflow-scrolling:touch}
#battle .in{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:8px}
#bcv{display:block;width:100%;aspect-ratio:128/112;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--line);box-shadow:0 0 0 2px var(--hi)}

.hp .t{display:flex;justify-content:space-between;font-weight:700}.hp .bar i{background:#6ad06a}.hp.foe .bar i{background:#e86a6a}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}.moves .act{min-height:54px;font-size:14px}
#blog{min-height:2.8em;background:#fff9e8;color:#273753;border:3px solid #273753;padding:7px 10px;font-weight:700;font-size:14px;line-height:1.4}
.stagebtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-top:6px}
.eggrow{display:flex;gap:10px;align-items:center;background:#14203a;border:2px solid var(--line);padding:6px;margin-top:6px}.eggrow canvas{width:72px;height:72px;image-rendering:pixelated}
.prog{height:9px;background:#0a1020;margin:4px 0 8px}.prog i{display:block;height:100%;background:#7ccc5a}
ol.howto{padding-left:22px;margin:6px 0}ol.howto li{margin:4px 0}code{background:#0a1020;padding:1px 5px;word-break:break-all;font-size:12px}
.tool{background:#2b4264;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #50698f;padding:9px 2px;font-size:13px;font-weight:700}
.tool:active{background:#22375a}
.hidden{display:none!important}
/* modal */
#modal{position:fixed;inset:0;background:#050a18cc;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#1d2c4a;border-top:4px solid #5a76a8;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);font-size:14px;line-height:1.6}
.sheet h2{margin:0 0 10px;font-size:18px}
.sheet p{margin:6px 0}
.sheet ul{margin:6px 0;padding-left:20px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1 1 auto;min-width:96px;background:#3a5580;border:2px solid var(--line);box-shadow:inset 0 -3px 0 #233a5e;padding:11px 10px;font-weight:800}
.btn.pri{background:#e8c98c;color:#3a2a2a;box-shadow:inset 0 -3px 0 #b88a52}
.btn.danger{background:#a8394c;box-shadow:inset 0 -3px 0 #6e1f30}
.sheet input[type=text],.sheet textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:2px solid var(--line);background:#fff9e8;color:#273753;border-radius:0}
.sheet textarea{height:84px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.err{color:#ff9aa8;min-height:1.2em;font-size:13px}
.codex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#14203a;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #3f5a88;padding:8px;text-align:center;font-size:12.5px;line-height:1.4}
.card canvas{width:96px;height:96px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.card b{font-size:14px}
.lean{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12.5px;margin-top:8px}
.lean .b{height:9px;background:#0a1020}.lean .b i{display:block;height:100%}
.sprites{overflow-x:auto;background:#7fb07a;padding:6px;border:2px solid var(--line)}
.sprites canvas{display:block;height:96px;image-rendering:pixelated;margin-bottom:4px}
.small{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:#fff3d5;color:#273753;border:3px solid #273753;box-shadow:3px 3px 0 #0008;padding:8px 14px;font-size:14px;font-weight:700;z-index:30;max-width:90%;text-align:center;transition:opacity .3s}
#toast.off{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div><h1>幻獸日記</h1><div class="ver">PIXEL FAMILIAR · V<span id="ver"></span></div></div>
  <div class="coin" aria-label="金幣"><canvas class="picon" data-icon="coin" data-s="2"></canvas><span id="coins">0</span></div>
 </header>
 <div id="saveWarn" class="tip warn hidden">⚠️ 目前無法寫入存檔（可能開啟了「私密瀏覽」）。請改用一般分頁，或到「存檔」匯出存檔碼保存。</div>

 </nav>
 <nav class="toolbar">

 </nav>
</div>
<div id="battle" class="hidden"><div class="in">
 <div class="hp foe"><div class="t"><span id="fName"></span><span id="fHp"></span></div><div class="bar"><i id="fBar"></i></div></div>
 <canvas id="bcv" width="128" height="112"></canvas>
 <div class="hp"><div class="t"><span id="mName"></span><span id="mHp"></span></div><div class="bar"><i id="mBar"></i></div></div>
 <div id="blog"></div>
 <div class="moves" id="moves">
  <button class="act" data-mv="tackle">💥 撞擊</button>

 </div>
 <button class="btn pri hidden" id="bDone">返回</button>
</div></div>

<script>
'use strict';
/* =========================================================
   幻獸日記 Pixel Familiar — V1.3
   單一檔案：遊戲邏輯 + 程式化 16-bit 像素 sprite sheet 產生器
   ========================================================= */
const VERSION='1.5.0';
const SAVE_KEY='pixel-familiar-save',BACKUP_KEY='pixel-familiar-save-backup',LEGACY_KEY='pixel-familiar-v1',TIP_KEY='pixel-familiar-tip-closed';
const W=128,H=112,CELL=48,PET_X=40,PET_Y=56;           // 場景邏輯解析度與角色格位置
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));
const num=(v,d,a,b)=>{v=Number(v);return Number.isFinite(v)?clamp(v,a,b):d};
const chars=t=>Array.from(String(t));
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- 安全儲存（失敗時退回記憶體，不讓遊戲當掉） ---------------- */
const store={ok:true,mem:{},
 get(k){try{return localStorage.getItem(k)}catch(e){this.ok=false;return k in this.mem?this.mem[k]:null}},
 set(k,v){try{localStorage.setItem(k,v);return true}catch(e){this.ok=false;this.mem[k]=v;return false}},
 del(k){try{localStorage.removeItem(k)}catch(e){}delete this.mem[k]}};

/* ---------------- 幻獸型態資料（進化路線） ---------------- */
const FORMS={
 egg:{name:'神秘的蛋',stage:0},
 baby:{name:'露露獸',en:'Lulu',stage:1,rx:11,ry:10,feat:['nubs'],tail:'small',
  pal:{o:'#1b2a44',b:'#5cc2b0',d:'#3a8c8a',l:'#a4ecd4',belly:'#e2f8e4',bellyD:'#b4e3c9',feet:'#8fd8c0',horn:'#f2c55c',hornD:'#c48a3a',acc:'#f2c55c',accD:'#c48a3a'},
  hint:'孵化後的幼年型態'},
 ember:{name:'焰角獸',en:'Ember Horn',stage:2,rx:13,ry:12,feat:['horns','crest'],tail:'flame',
  pal:{o:'#2a1820',b:'#e8673e',d:'#a83a2e',l:'#ffab72',belly:'#ffe2aa',bellyD:'#f2b878',feet:'#ffab72',horn:'#fff0c0',hornD:'#d9a441',acc:'#ffd34a',accD:'#ff7a2a'},
  hint:'常常陪牠「玩耍」'},
 mist:{name:'霧鰭獸',en:'Mist Fin',stage:2,rx:13,ry:12,feat:['fins','antenna'],tail:'fin',
  pal:{o:'#14223e',b:'#4f9ee0',d:'#2f62a8',l:'#94d4f6',belly:'#e6f7ff',bellyD:'#b8def2',feet:'#94d4f6',horn:'#bff4ff',hornD:'#5fc4e8',acc:'#aef0ff',accD:'#4fb4dc'},
  hint:'常常幫牠「洗澡」'},
 sylvan:{name:'森羽獸',en:'Sylvan Wing',stage:2,rx:13,ry:12,feat:['wings','leaves','flower'],tail:'leaf',
  pal:{o:'#1a2a1e',b:'#62b85c',d:'#3a7f45',l:'#a6e283',belly:'#f6f0c4',bellyD:'#ddd39a',feet:'#a6e283',horn:'#f7a8c0',hornD:'#d9709a',acc:'#c8f08a',accD:'#6fb84a'},
  hint:'常常「餵食」和「摸摸」'}
};
const ROUTES=['ember','mist','sylvan'];

/* ---------------- 隨機物種基因（V1.4） ----------------
   每顆蛋只存一個 seed（種子數字），外觀由 makeGenome(seed) 決定。
   ⚠️ 不要更改下面清單的順序或抽籤順序，否則舊存檔的怪獸外觀會改變。 */
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsl(h,s,l){h=((h%360)+360)%360;s=clamp(s)/100;l=clamp(l)/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
 return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
const G_SIDE=['nubs','horns','leaves','ears','bunny','none'],G_TOP=['none','none','antenna','flower','crest','tuft'],
 G_TAIL=['small','fluffy','fin','leaf','flame','none'],G_PAT=['none','none','spots','stripes','belly'],G_EYE=['open','big'];
function makeGenome(seed){const r=rng(seed),pick=a=>a[Math.floor(r()*a.length)];
 const q=r(),rarity=q<.05?3:q<.25?2:1,hue=Math.floor(r()*360);
 const G={seed,rarity,hue,sat:45+Math.floor(r()*30),acc:(hue+140+Math.floor(r()*80))%360,bh:(hue+Math.floor(r()*60)-30+360)%360,
  rx:10+Math.floor(r()*3),ry:9+Math.floor(r()*3),side:pick(G_SIDE),top:pick(G_TOP),tail:pick(G_TAIL),pattern:pick(G_PAT),eyes:pick(G_EYE),wings:r()<.15};
 if(rarity>=2&&G.pattern==='none')G.pattern=['spots','stripes','belly'][Math.floor(r()*3)];
 return G}
const HUE_NAMES=[[15,'緋','Scarlet'],[40,'焰','Blaze'],[65,'琥','Amber'],[95,'苔','Moss'],[150,'翠','Jade'],[185,'湖','Lagoon'],[215,'霜','Frost'],[250,'夜','Night'],[285,'紫','Violet'],[320,'霞','Dusk'],[345,'桃','Peach'],[361,'緋','Scarlet']];
const SIDE_NAMES={nubs:['角','Nub'],horns:['角','Horn'],leaves:['葉','Leaf'],ears:['耳','Ear'],bunny:['兔','Bun'],none:['絨','Fluff']};
const ROUTE_NAMES={ember:['炎','Ember'],mist:['霧','Mist'],sylvan:['森','Sylvan']};
const RARITY=['','普通','稀有','傳說'],STARS=['','★','★★','★★★'];
function speciesName(G,route){const hn=HUE_NAMES.find(([m])=>G.hue<m),sn=SIDE_NAMES[G.side];
 const pre=G.rarity===3?'星':'',epre=G.rarity===3?'Star ':'';
 return route?{name:pre+hn[1]+sn[0]+ROUTE_NAMES[route][0]+'獸',en:`${epre}${hn[2]} ${sn[1]} · ${ROUTE_NAMES[route][1]}`}
  :{name:pre+hn[1]+sn[0]+'獸',en:`${epre}${hn[2]} ${sn[1]}`}}
function genomeForm(G,route){
 const ah=route==='ember'?40:route==='mist'?195:route==='sylvan'?95:G.acc,gold=G.rarity===3,h=G.hue,s=G.sat;
 const pal={o:hsl(h,35,13),b:hsl(h,s,56),d:hsl(h,s,38),l:hsl(h,s-5,75),feet:hsl(h,s-5,75),pat:hsl(h,s+10,42),
  belly:G.pattern==='belly'?hsl(G.acc,60,86):hsl(G.bh,45,91),bellyD:G.pattern==='belly'?hsl(G.acc,50,74):hsl(G.bh,35,79),
  horn:gold?'#ffe680':hsl(ah,70,76),hornD:gold?'#d9a441':hsl(ah,60,52),acc:gold?'#ffd34a':hsl(ah,80,68),accD:gold?'#e0902a':hsl(ah,70,48)};
 const feat=[],add=f=>{if(f&&f!=='none'&&!feat.includes(f))feat.push(f)};
 let side=G.side,top=G.top,tail=G.tail;
 if(route==='ember'){if(side==='nubs'||side==='none')side='horns';if(top==='none')top='crest';tail='flame'}
 if(route==='mist'){add('fins');if(top==='none')top='antenna';tail='fin'}
 if(route==='sylvan'){add('wings');if(top==='none')top='flower';tail='leaf'}
 add(side==='leaves'?'leaves':side);add(top);if(G.wings)add('wings');
 if(G.pattern==='spots'||G.pattern==='stripes')add('pat-'+G.pattern);if(gold)add('sparkle');if(G.eyes==='big')add('bigeyes');
 const nm=speciesName(G,route);
 return{name:nm.name,en:nm.en,stage:route?2:1,rx:G.rx+(route?2:0),ry:G.ry+(route?2:0),feat,tail,pal,genome:G}}

const CLASSIC_G={rarity:1,hue:168,sat:45,acc:42,bh:130,rx:11,ry:10,side:'nubs',top:'none',tail:'small',pattern:'none',eyes:'open',wings:false};

 r.eggTaps=Math.floor(num(o.eggTaps,0,0,4));
 if(typeof o.name==='string'){const n=chars(o.name.trim()).slice(0,10).join('');if(n)r.name=n}
 r.level=Math.floor(num(o.level,1,1,99));r.xp=Math.floor(num(o.xp,0,0,1e6));r.coins=Math.floor(num(o.coins,20,0,9999999));

const RATE={hunger:.12,clean:.06,energy:.04,mood:.07,sleepEnergy:15,sleepHunger:.05,sleepClean:.02}; // 每分鐘
function applyDecay(m){
 if(!s.hatched||!(m>0))return;
 if(s.sleeping){
  const t=Math.min(m,Math.max(0,(100-s.energy)/RATE.sleepEnergy));
  s.energy=clamp(s.energy+t*RATE.sleepEnergy);s.sleepGain=clamp(s.sleepGain+t*RATE.sleepEnergy);
  s.hunger=clamp(s.hunger-t*RATE.sleepHunger);s.clean=clamp(s.clean-t*RATE.sleepClean);m-=t;
  if(s.energy>=99.9)wake(true);if(m<=0)return}
 s.hunger=clamp(s.hunger-m*RATE.hunger);s.clean=clamp(s.clean-m*RATE.clean);s.energy=clamp(s.energy-m*RATE.energy);
 let md=RATE.mood;if(s.hunger<20)md+=.08;if(s.clean<20)md+=.05;if(s.energy<15)md+=.04;s.mood=clamp(s.mood-m*md)}
function tick(){const now=Date.now();const m=(now-s.lastTick)/60000;s.lastTick=now;if(m>0)applyDecay(Math.min(m,1440))}

/* =========================================================
   像素繪圖核心：grid → 自動描邊 → ImageData
   ========================================================= */
function grid(w,h){return{w,h,a:new Array(w*h).fill(0)}}
function px(g,x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<g.w&&y<g.h)g.a[y*g.w+x]=c}
function get(g,x,y){return x>=0&&y>=0&&x<g.w&&y<g.h?g.a[y*g.w+x]:0}
function ellipse(g,cx,cy,rx,ry,fn){
 for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
  const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry;if(nx*nx+ny*ny<=1){const c=fn(x,y,nx,ny);if(c)px(g,x,y,c)}}}
function outline(g,col){const b=g.a.slice();for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){if(b[y*g.w+x])continue;
 if((x>0&&b[y*g.w+x-1])||(x<g.w-1&&b[y*g.w+x+1])||(y>0&&b[(y-1)*g.w+x])||(y<g.h-1&&b[(y+1)*g.w+x]))g.a[y*g.w+x]=col}}
const rgbCache={};
function rgb(h){if(rgbCache[h])return rgbCache[h];const n=parseInt(h.slice(1),16);return rgbCache[h]=[n>>16&255,n>>8&255,n&255]}
function blit(g,img,ox,oy=0){for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){const c=g.a[y*g.w+x];if(!c)continue;
 const i=((oy+y)*img.width+ox+x)*4,[r,gg,b]=rgb(c);img.data[i]=r;img.data[i+1]=gg;img.data[i+2]=b;img.data[i+3]=255}}
function gridCanvas(g){const cv=document.createElement('canvas');cv.width=g.w;cv.height=g.h;const ctx=cv.getContext('2d');const img=ctx.createImageData(g.w,g.h);blit(g,img,0);ctx.putImageData(img,0,0);return cv}

function checksum(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h.toString(36)}
function exportCode(){const b64=btoa(unescape(encodeURIComponent(JSON.stringify({app:'pixel-familiar',ver:VERSION,at:Date.now(),save:s}))));return'PF1.'+b64+'.'+checksum(b64)}
function decodeCode(code){code=String(code||'').replace(/\s+/g,'');
 if(code.startsWith('{')){const o=parse(code);return o&&(o.save||o)}
 const m=/^PF1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/.exec(code);if(!m)throw new Error('格式不正確');if(checksum(m[1])!==m[2])throw new Error('存檔碼不完整或被修改過');
 const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o||o.app!=='pixel-familiar'||!o.save)throw new Error('這不是幻獸日記的存檔');return o.save}
function fmtTime(t){if(!t)return'從未';const d=new Date(t);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

 const n=Math.floor(Number(String(raw).replace(/[,，\s]/g,'')));if(!Number.isFinite(n)||n<0)return{err:'步數格式不正確'};

 const v=Math.min(n,STEP_DAY_CAP),prev=s.steps.days[date]||0,delta=v-prev;
 if(delta<=0)return{delta:0,prev,v};
 const t0=tier();s.steps.days[date]=v;s.steps.total+=delta;s.steps.rem+=delta;
 const k=Math.floor(s.steps.rem/1000);s.steps.rem-=k*1000;

<p class="small">每次挑戰花 1 冒險點、10 體力。走路可以賺冒險點（每 1,000 步 +1），每天也會免費補到 3 點。<br>屬性相剋：🔥 剋 🌿、🌿 剋 💧、💧 剋 🔥（傷害 1.5 倍）。每 5 關有 Boss。</p>
${can?'':'<p class="err">'+(s.hatched?'牠在睡覺，先叫醒牠吧':'先孵化幻獸才能冒險')+'</p>'}${list}`);
 document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{if(!can)return;
  if(s.adv.pts<1){toast('冒險點不夠了！去走走路或明天再來 👟');return}if(s.energy<15){toast('體力不夠，先讓牠睡一下');return}
  closeModal();startBattle(+b.dataset.st)})}
function startBattle(n){tick();s.adv.pts--;s.energy=clamp(s.energy-10);s.hunger=clamp(s.hunger-5);save();renderUI();
 const cond=s.mood<30?.85:1,me=mkFighter(s.name,formKey(),s.level,s.route,tier(),cond),foe=foeFor(n);
 B={n,me,foe,busy:false,over:false,fx:{me:{dx:0,dy:0,flash:0,faint:0,anim:null,t0:0},foe:{dx:0,dy:0,flash:0,faint:0,anim:null,t0:0}}};bparts.length=0;
 $('battle').classList.remove('hidden');$('bDone').classList.add('hidden');$('moves').classList.remove('hidden');
 $('mvSp').textContent='✨ '+SP_NAME[me.el];blog(`${foe.name} 出現了！（${EL_NAME[foe.el]} Lv.${foe.level}）`);bUI();sfx('play')}
function blog(t){$('blog').textContent=t}
function bUI(){const{me,foe}=B;$('fName').textContent=`${foe.name}  Lv.${foe.level} ${EL_NAME[foe.el]}`;$('fHp').textContent=`${foe.hp}/${foe.max}`;$('fBar').style.width=foe.hp/foe.max*100+'%';
 $('mName').textContent=`${me.name}  Lv.${me.level} ${EL_NAME[me.el]}${tier()?' '+'✦'.repeat(tier()):''}`;$('mHp').textContent=`${me.hp}/${me.max}`;$('mBar').style.width=me.hp/me.max*100+'%';
 $('mvSp').disabled=me.cd>0;$('mvSp').textContent='✨ '+SP_NAME[me.el]+(me.cd>0?`（${me.cd}）`:'');document.querySelectorAll('#moves .act').forEach(b=>{if(b!==$('mvSp'))b.disabled=B.busy;else b.disabled=B.busy||me.cd>0})}
function aiMove(f){if(f.hp<f.max*.3&&Math.random()<.35)return'guard';if(f.cd===0&&Math.random()<.5)return'special';return'tackle'}
async function doMove(a,d,mv,side){
 const A=B.fx[side],D=B.fx[side==='me'?'foe':'me'];
 if(mv==='guard'){a.guard=true;const h=Math.round(a.max*.08);a.hp=Math.min(a.max,a.hp+h);blog(`${a.name} 擺出防禦姿勢！（回復 ${h}）`);A.anim='happy';A.t0=performance.now();sfx('pet');bUI();await sleep(900);return}
 const sp=mv==='special',pow=sp?(a.el==='none'?1.15:1.3):1;if(sp)a.cd=3;
 let mult=1;if(sp&&a.el!=='none'&&d.el!=='none'){if(BEATS[a.el]===d.el)mult=1.5;else if(BEATS[d.el]===a.el)mult=.67}
 let dmg=Math.max(1,Math.round(a.atk*pow*(a.atk/(a.atk+d.def))*1.6*mult*(.85+Math.random()*.3)));if(d.guard){dmg=Math.max(1,Math.round(dmg*.5));d.guard=false}
 const crit=Math.random()<.08;if(crit)dmg=Math.round(dmg*1.5);
 blog(`${a.name} 使出${sp?'「'+SP_NAME[a.el]+'」':'撞擊'}！`);A.anim='jump';A.t0=performance.now();const dir=side==='me'?1:-1;A.dx=10*dir;A.dy=-6*dir;sfx(sp?'evolve':'tap');await sleep(220);A.dx=0;A.dy=0;
 d.hp=Math.max(0,d.hp-dmg);D.flash=performance.now()+500;buzz(20);
 const tx=side==='me'?94:34,ty=side==='me'?50:82;spawn(sp?SP_ICON[a.el]:'spark',sp?6:3,{x:tx,y:ty,vy:-20,jx:30,life:.8,spread:16},bparts);sfx('crack');bUI();
 await sleep(450);blog(`${crit?'會心一擊！':''}造成 ${dmg} 點傷害${mult>1?'，效果絕佳！':mult<1?'，效果不太好…':''}`);await sleep(750)}
async function onMove(mv){if(!B||B.busy||B.over)return;unlockAudio();
 if(mv==='run'){B.busy=true;bUI();blog(`${B.me.name} 逃跑了…`);await sleep(800);endBattle(null);return}
 if(mv==='special'&&B.me.cd>0)return;B.busy=true;bUI();
 const{me,foe}=B,fm=aiMove(foe),meFirst=me.spd>foe.spd||(me.spd===foe.spd&&Math.random()<.5)||mv==='guard';
 const order=fm==='guard'&&mv!=='guard'?[['foe',fm],['me',mv]]:meFirst?[['me',mv],['foe',fm]]:[['foe',fm],['me',mv]];
 for(const[side,m]of order){const a=side==='me'?me:foe,d=side==='me'?foe:me;if(a.hp<=0)break;await doMove(a,d,m,side);if(d.hp<=0)break}
 me.cd=Math.max(0,me.cd-1);foe.cd=Math.max(0,foe.cd-1);
 if(foe.hp<=0){B.fx.foe.faint=performance.now();blog(`${foe.name} 倒下了！`);await sleep(900);endBattle(true);return}
 if(me.hp<=0){B.fx.me.faint=performance.now();blog(`${me.name} 沒力氣了…`);await sleep(900);endBattle(false);return}
 B.busy=false;bUI()}
function endBattle(win){B.over=true;$('moves').classList.add('hidden');$('bDone').classList.remove('hidden');const n=B.n;
 if(win){const c=8+n*2,x=15+n*3;s.coins+=c;s.adv.wins++;s.mood=clamp(s.mood+5);if(n===s.adv.stage)s.adv.stage++;
  blog(`🎉 勝利！金幣 +${c}、經驗 +${x}${n===s.adv.stage-1?`，解鎖第 ${s.adv.stage} 關！`:''}`);sfx('level');spawn('star',10,{x:40,y:70,vy:-30,jx:50,life:1.4},bparts);gainXP(x)}
 else if(win===false){s.adv.losses++;s.mood=clamp(s.mood-5);blog('輸了…讓牠休息一下，再挑戰吧！');sfx('no')}
 else blog('順利逃走了。');save();renderUI()}
function closeBattle(){$('battle').classList.add('hidden');B=null;renderUI();if(s.hatched)say(s.mood>60?'冒險好好玩！':'有點累了…')}
const bcv=$('bcv'),bctx=bcv.getContext('2d');bctx.imageSmoothingEnabled=false;
function drawBattle(now){if(!B||!bgCache)return;const c=bctx;c.drawImage(bgCache,0,0);c.fillStyle='rgba(10,20,40,.15)';c.fillRect(0,0,W,H);
 const one=(f,FX,x,y,side)=>{const S=sheet(f.key);let fr;if(f.hp<=0)fr='sad0';else if(FX.anim==='jump'&&now-FX.t0<500)fr=['jump0','jump1','jump0'][Math.floor((now-FX.t0)/170)%3];
  else if(FX.anim==='happy'&&now-FX.t0<800)fr='happy0';else fr=f.hp<f.max*.3?['tired0','tired1'][Math.floor(now/600)%2]:['idle0','idle0','idle1','idle1'][Math.floor(now/400)%4];
  c.fillStyle='rgba(20,60,30,.3)';c.fillRect(x+12,y+44,24,2);
  const fade=FX.faint?Math.max(0,1-(now-FX.faint)/700):1;c.globalAlpha=fade;
  const src=(FX.flash>now&&Math.floor(now/70)%2===0)?S.sil:S.cv;c.drawImage(src,S.idx[fr]*CELL,0,CELL,CELL,x+FX.dx,y+FX.dy+(FX.faint?Math.min(8,(now-FX.faint)/60):0),CELL,CELL);c.globalAlpha=1};
 one(B.foe,B.fx.foe,70,18,'foe');one(B.me,B.fx.me,10,56,'me');
 const dt=.045;for(let i=bparts.length-1;i>=0;i--){const p=bparts[i];p.t+=dt;if(p.t<0)continue;if(p.t>p.life){bparts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  const ic=ICV[p.ic];c.globalAlpha=p.t>p.life-.3?Math.max(0,(p.life-p.t)/.3):1;c.drawImage(ic,Math.round(p.x-ic.width/2),Math.round(p.y-ic.height/2));c.globalAlpha=1}}
document.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('click',()=>onMove(b.dataset.mv)));

 if(!inFrame&&'serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude|anthropic/.test(location.hostname))

}
