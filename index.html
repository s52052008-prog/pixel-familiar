function hsl(h,s,l){h=((h%360)+360)%360;s=clamp(s)/100;l=clamp(l)/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));

const CLASSIC_NAMES={juv:['露露獸','Lulu'],flame:['焰尾獸','Flametail'],tide:['潮靈獸','Tidewisp'],forest:['森語獸','Forestsong'],earth:['岩甲獸','Rockshell'],bird:['風翼獸','Windwing'],elec:['雷光獸','Sparkling'],metal:['鋼鎧獸','Steelguard']};

function parseCode(code){const[a,b]=String(code).split('-');if(a==='baby')return{lv:-1,route:b||null};if(a==='juv')return{lv:0,route:b||null};if(a==='teen')return{lv:1,route:b||null};if(a==='asc')return{lv:3,route:b||null};return{lv:2,route:ROUTES.includes(a)?a:null}}

 if(classic){const b=CLASSIC_NAMES[full?route:'juv'];return{name:(asc?'聖':'')+b[0],en:(asc?'Ascended ':'')+b[1]}}

 return full?{name:pre+hn[1]+sn[0]+ROUTE_NAMES[route][0]+'獸',en:`${epre}${hn[2]} ${sn[1]} · ${ROUTE_NAMES[route][1]}`}:{name:pre+hn[1]+sn[0]+'獸',en:`${epre}${hn[2]} ${sn[1]}`}}

const SPECIES={flame:['焰狐','Ember Fox'],tide:['潮螈','Tide Axolotl'],forest:['森鹿','Grove Fawn'],bird:['翼雀','Sky Finch'],earth:['岩角','Rockhorn'],metal:['鋼鱗','Steelscale'],elec:['雷猴','Volt Monkey']};

/* ---------------- 時間（離線模擬規則在 game-core.js） ---------------- */
let clockWarned=false;

 if(r.events&&r.events.length&&s.hatched){if(r.events.includes('toilet'))whenFree(()=>toast('🚽 牠自己去上廁所了，好乖！',3000));if(r.events.includes('rainwater'))whenFree(()=>toast(`🌧️ 下雨了，田裡 ${s.rainWatered||''} 塊作物喝飽雨水，不用澆了`,3500));
  if(r.events.includes('poop')&&r.hours<.05){say('嗯嗯…💩 大便了！快點一下清掉');sfx('crack')}

/* =========================================================
   像素繪圖核心：grid → 自動描邊 → ImageData
   ========================================================= */
function grid(w,h){return{w,h,a:new Array(w*h).fill(0)}}
function px(g,x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<g.w&&y<g.h)g.a[y*g.w+x]=c}
function get(g,x,y){return x>=0&&y>=0&&x<g.w&&y<g.h?g.a[y*g.w+x]:0}
function ellipse(g,cx,cy,rx,ry,fn){
 for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
  const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry;if(nx*nx+ny*ny<=1){const c=fn(x,y,nx,ny);if(c)px(g,x,y,c)}}}
function outline(g,col){const b=g.a.slice();for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){if(b[y*g.w+x])continue;
 if((x>0&&b[y*g.w+x-1])||(x<g.w-1&&b[y*g.w+x+1])||(y>0&&b[(y-1)*g.w+x])||(y<g.h-1&&b[(y+1)*g.w+x]))g.a[y*g.w+x]=col}}
// 場景用的外框：取旁邊那格的顏色再加深（不是黑線），背景物件看起來一致、柔和；幻獸和球維持黑框才會跳出來
function outlineSelf(g,k=.55){const b=g.a.slice(),W=g.w,H=g.h;for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(b[y*W+x])continue;
 const n=[x>0&&b[y*W+x-1],x<W-1&&b[y*W+x+1],y>0&&b[(y-1)*W+x],y<H-1&&b[(y+1)*W+x]].filter(Boolean);if(!n.length)continue;
 let best=null,bl=1e9;for(const c of n){if(c[0]!=='#')continue;const[r,gg,bb]=rgb(c),l=r+gg+bb;if(l<bl){bl=l;best=[r,gg,bb]}}if(!best)continue;
 g.a[y*W+x]='#'+best.map(v=>Math.round(v*k).toString(16).padStart(2,'0')).join('')}}
const rgbCache={};
function rgb(h){if(rgbCache[h])return rgbCache[h];const n=parseInt(h.slice(1),16);return rgbCache[h]=[n>>16&255,n>>8&255,n&255]}
function blit(g,img,ox,oy=0){for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){const c=g.a[y*g.w+x];if(!c)continue;
 const i=((oy+y)*img.width+ox+x)*4,[r,gg,b]=rgb(c);img.data[i]=r;img.data[i+1]=gg;img.data[i+2]=b;img.data[i+3]=255}}
function gridCanvas(g){const cv=document.createElement('canvas');cv.width=g.w;cv.height=g.h;const ctx=cv.getContext('2d');const img=ctx.createImageData(g.w,g.h);blit(g,img,0);ctx.putImageData(img,0,0);return cv}

 if(F.tail==='feather'){for(let k=0;k<3;k++){const ox=tx+2+k*2,oy=ty-4+k;for(let j=0;j<4;j++){px(g,ox+j,oy-j+k,j===0?P.accD:P.acc)}}px(g,tx+2,ty-1,P.accD)}

 if(F.tail==='blade'){for(let k=0;k<6;k++)for(let j=0;j<=Math.floor(k/2);j++)px(g,tx+2+k,ty-2-j,j===0?P.accD:(k%2?P.acc:'#ffffff'))}
 if(F.tail==='leaf'){rect(tx+2,ty-4,2,P.acc);rect(tx+1,ty-3,4,P.acc);rect(tx+1,ty-2,4,P.acc);rect(tx+2,ty-1,2,P.acc);px(g,tx+3,ty-3,P.accD);px(g,tx+2,ty-2,P.accD)}

 // --- 身體（光源左上） ---

function checksum(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h.toString(36)}
function exportCode(){const b64=btoa(unescape(encodeURIComponent(JSON.stringify({app:'pixel-familiar',ver:VERSION,at:Date.now(),save:s}))));return'PF1.'+b64+'.'+checksum(b64)}
function decodeCode(code){code=String(code||'').replace(/\s+/g,'');
 if(code.startsWith('{')){const o=parse(code);return o&&(o.save||o)}
 const m=/^PF1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/.exec(code);if(!m)throw new Error('格式不正確');if(checksum(m[1])!==m[2])throw new Error('存檔碼不完整或被修改過');
 const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o||o.app!=='pixel-familiar'||!o.save)throw new Error('這不是幻獸日記的存檔');return o.save}

function drawGen(now){if(!hasGen())return;const on=ICV.gen_on,off=ICV.gen_off;if(!on)return;const lit=Math.floor(now/1400)%5!==4,im=lit?on:off,[ax,ay]=YARD_ANCHOR.gen,[dx,dy,k,f]=yardOf('gen'),sc=.75*k;
 ctx.save();ctx.translate(ax+dx,ay+dy);ctx.scale(f?-sc:sc,sc);ctx.drawImage(im,-Math.round(im.width/2),-im.height);ctx.restore();
 if(lit&&Math.random()<.03)spawn('bolt',1,{x:ax+dx,y:ay+dy-14*k,vy:-10,life:.4,spread:6})}

/* =========================================================

const fmtDur=ms=>{const m=Math.floor(ms/60000),h=Math.floor(m/60);return h?`${h} 小時 ${m%60} 分`:`${m} 分鐘`};
const fmtDate=t=>{const d=new Date(t);return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`};
let tickLast=Date.now(),tickN=0;
setInterval(()=>{const now=Date.now(),dt=now-tickLast;tickLast=now;if(!s||document.visibilityState!=='visible')return;
 const rc=PC.playTick(s,Math.min(dt,5000),now);tickN++;
 if(tickN%5===0){const got=PC.checkBadges(s,now);if(got.length){save();renderUI();got.forEach((b,i)=>setTimeout(()=>{toast(`🏅 獲得成就「${b.name}」！金幣 +${b.coins}`,3500);sfx('level')},i*3600))}}
 if(tickN%30===0)save();
 if((rc||(s.stats&&s.stats.recap&&!s.stats.recap.seen))&&$('modal').classList.contains('hidden')&&!FZ&&!TG&&$('battle').classList.contains('hidden')&&!ARR.on&&!YA.on&&!window.PF_NO_SKILLS)weekRecap()},1000);
document.addEventListener('visibilitychange',()=>{tickLast=Date.now();if(document.visibilityState==='hidden'&&s)save()});
function weekRecap(){const R=s.stats&&s.stats.recap;if(!R)return;R.seen=true;save();const d=R.d,e=new Date(R.week+'T00:00:00Z');e.setUTCDate(e.getUTCDate()+6);const md=t=>`${t.getUTCMonth()+1}/${t.getUTCDate()}`;
 const rows=[['⏱️','遊玩時間',fmtDur(d.play||0)],['🪙','賺到',`${fmtN(d.earned||0)} 金幣`],['💸','花掉',`${fmtN(d.spent||0)} 金幣`],['🍽️','餵食',`${d.feed||0} 次`],['🛁','洗澡',`${d.wash||0} 次`],['⚽','陪玩頂球',`${d.ball||0} 次`],['⚔️','冒險勝利',`${d.win||0} 場`],['🎣','釣到魚',`${d.catch||0} 條`],['🌾','收成',`${d.harvest||0} 次`],['👟','步數',`${fmtN(d.steps||0)} 步`]];
 openModal(`📅 上週回顧（${md(new Date(R.week+'T00:00:00Z'))}～${md(e)}）`,`<p class="small">${esc(s.name||'牠')}和你一起度過的一週：</p><div class="stgrid">${rows.map(([i,n,v])=>`<div class="stc"><span>${i} ${n}</span><b>${v}</b></div>`).join('')}</div><p class="small">每週一會整理上一週的紀錄，可以截圖留念 📸</p>`,[{t:'好！',cls:'pri'}]);sfx('level')}
function codexTabs(on){return`<div class="row cxtabs" style="margin-top:0"><button class="btn${on==='stats'?' pri':''}" data-jt="stats">📊 紀錄</button><button class="btn${on==='badges'?' pri':''}" data-jt="badges">🏅 成就</button><button class="btn${on==='diary'?' pri':''}" data-jt="diary">📔 日記</button></div>`}
function wireJTabs(){document.querySelectorAll('[data-jt]').forEach(b=>b.onclick=()=>{sfx('tap');({stats:statsDialog,badges:badgeDialog,diary:diaryDialog})[b.dataset.jt]()})}
function statsDialog(){navMark('dex',statsDialog);const S=PC.statsOf(s),C=S.cnt,now=Date.now(),earn=PC.sumOf(S.earn),spend=PC.sumOf(S.spend),F=PC.fishOf(s),today=S.today&&S.today.d===PC.dayKey(now)?S.today.ms:0;
 const list=(o,N)=>Object.entries(o).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="stl"><span>${N[k]||k}</span><b>${fmtN(v)}</b></div>`).join('')||'<p class="small">還沒有紀錄</p>';
 const best=Object.keys(F.dex).filter(k=>PC.FISH[k]).sort((a,b)=>PC.FISH[b].star-PC.FISH[a].star)[0];
 const sec=(h,cells)=>`<h3 class="dexh">${h}</h3><div class="stgrid">${cells.map(([n,v])=>`<div class="stc"><span>${n}</span><b>${v}</b></div>`).join('')}</div>`;
 openModal('📔 日記',`${codexTabs('stats')}<div class="sttoday">今天玩了 <b>${fmtDur(today)}</b></div>
 ${sec('⏱️ 時間',[['總遊玩時間',fmtDur(S.play)],['第一次玩',S.first?fmtDate(S.first):'—'],['玩了幾天',`${S.days} 天`],['連續登入',`${S.streak} 天（最長 ${S.best}）`]])}
 <h3 class="dexh">🪙 金錢</h3><div class="stgrid"><div class="stc"><span>總共賺到</span><b>${fmtN(earn)}</b></div><div class="stc"><span>總共花掉</span><b>${fmtN(spend)}</b></div></div>
 <div class="stcols"><div><p class="sth">💰 從哪裡賺</p>${list(S.earn,PC.EARN_NAME)}</div><div><p class="sth">🛒 花在哪裡</p>${list(S.spend,PC.SPEND_NAME)}</div></div>
 ${sec('🐾 照顧',[['餵食',`${C.feed} 次`],['洗澡',`${C.wash} 次`],['陪玩頂球',`${C.play} 次`],['睡覺',`${C.sleep} 次`],['清大便、果核',`${C.clean} 次`]])}
 ${sec('⚔️ 冒險',[['戰鬥',`${C.battle} 場`],['勝 / 敗',`${C.win} / ${C.loss}`],['打倒王',`${C.boss} 次`],['會心一擊',`${C.crit} 次`],['最遠關卡',`第 ${(s.adv&&s.adv.stage)||1} 關`]])}
 ${sec('🌱 種田',[['種下',`${C.plant} 次`],['收成',`${C.harvest} 次`],['爛掉',`${C.rot} 次`],['摘野莓、撿蘋果',`${C.berry} / ${C.apple}`]])}
 ${sec('🎣 釣魚',[['拋竿',`${C.cast} 次`],['釣到魚',`${C.catch} 條`],['跑掉、斷線',`${C.miss} 次`],['寶箱 / 雜物',`${C.chest} / ${C.junk}`],['魚類圖鑑',`${Object.keys(F.dex).filter(k=>PC.FISH[k]).length} / 14`],['最稀有的一條',best?`${'★'.repeat(PC.FISH[best].star)} ${PC.FISH[best].name}`:'—']])}
 ${sec('🥚 幻獸',[['孵過',`${C.hatch} 隻`],['進化',`${C.evolve} 次`],['配對',`${C.breed} 次`],['圖鑑物種',`${s.dex.length} 種`]])}
 ${sec('👟 步數',[['累計',`${fmtN((s.steps&&s.steps.total)||0)} 步`]])}
 ${S.recap?'<div class="row"><button class="btn" id="stRecap">📅 看上週回顧</button></div>':''}<p class="small">統計從 V1.84 開始記錄；洗澡、收成、冒險勝敗、步數有接上以前的次數。</p>`);
 wireJTabs();if($('stRecap'))$('stRecap').onclick=weekRecap}
function badgeDialog(){const B=PC.BADGES.map(x=>PC.BADGE[x[0]]),got=B.filter(b=>s.badges&&s.badges[b.id]).length;
 openModal('📔 日記',`${codexTabs('badges')}<p class="small">已獲得 <b>${got}</b> / ${B.length} 個成就，每拿到一個都有金幣獎勵。</p><div class="bdgrid">${B.map(b=>{const at=s.badges&&s.badges[b.id],v=Math.min(b.need,PC.statVal(s,b.key)),pct=Math.round(v/b.need*100);
  return`<div class="bdg ${at?'on':''}"><i>${at?b.icon:'🔒'}</i><b>${b.name}</b><span class="small">${at?fmtDate(at)+' 獲得':`${Math.floor(v)} / ${b.need}`}</span>${at?'':`<div class="prog"><i style="width:${pct}%"></i></div>`}<span class="small">🪙 ${b.coins}</span></div>`}).join('')}</div>`);wireJTabs()}
function diaryDialog(){const J=s.journal.slice().reverse();openModal('📔 日記',codexTabs('diary')+(J.length?J.map(j=>`<p><span class="small">${fmtTime(j.at)}</span>　${esc(j.t)}</p>`).join(''):'<p>日記還是空白的。孵化之後，重要的事都會自動記下來。</p>'));wireJTabs()}

 debug:{info(){return{busy:busyUntil-Date.now(),evo:!!evo,modal:!$('modal').classList.contains('hidden'),taps:s.eggTaps,h:s.hatched,battle:!!B}},skip(min){s.lastTick-=min*60000;tick();renderUI();save()},age(h){s.hatchedAt-=h*3600000;save();runStages();renderUI()},xp(n){const x0=s.xp;PC.addXP(s,n);save();renderUI();afterChange(x0)},set(o){Object.assign(s,o);renderUI();save()}}};
