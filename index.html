<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>幻獸日記 Pixel Familiar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#0e1528;--panel:#1d2c4a;--line:#0a1020;--hi:#3f5a88;--text:#fff3d5;--muted:#b9c8e6;--gold:#f2c55c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:9px;
 padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 12px);
 background:linear-gradient(#1b2a48,#111a30)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:20px;letter-spacing:1px;white-space:nowrap}
.ver{font-size:10px;color:var(--muted);letter-spacing:2px}
.coin{display:flex;align-items:center;gap:6px;background:var(--line);border:2px solid var(--hi);padding:5px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.tip{background:#2b3f66;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #5a76a8;padding:8px 34px 8px 10px;font-size:12.5px;line-height:1.45;position:relative}
.tip button{position:absolute;right:0;top:0;background:none;border:0;font-size:16px;min-width:44px;min-height:44px}
.warn{background:#5a2232;box-shadow:inset 0 0 0 2px #c0465a}
.stagewrap{position:relative;border:3px solid var(--line);box-shadow:0 0 0 2px var(--hi),0 5px 0 2px #000c}
#scene{display:block;width:100%;aspect-ratio:128/112;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer;background:#6fb8e8}
#bubble{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:90%;width:max-content;background:#fff9e8;color:#273753;border:3px solid #273753;box-shadow:3px 3px 0 #0006;padding:5px 10px;font-size:14px;font-weight:700;text-align:center;line-height:1.35;transition:opacity .25s;pointer-events:none}
#bubble.off{opacity:0}
.viewbtn{position:absolute;left:6px;top:6px;min-width:44px;min-height:44px;background:#2b4264e6;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #50698f;padding:6px 10px;font-size:13px;font-weight:800}
.shoptabs{display:flex;gap:6px;margin-bottom:8px}.shoptabs .btn{min-width:0}.shoptabs .btn.on{background:#e8c98c;color:#3a2a2a}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#14203a;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #3f5a88;padding:8px;text-align:center;font-size:12.5px}
.item canvas{height:56px;image-rendering:pixelated;display:block;margin:0 auto 4px;max-width:100%}.item .btn{width:100%;min-width:0;margin-top:6px;padding:10px 2px}
.nameplate{text-align:center;line-height:1.25}
#petname{font-size:20px;font-weight:900}
#stageText,#growText,#traitText{font-size:12px;color:var(--muted)}#traitText{color:#ffe2a8}#growText{color:#ffd0dc}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 0 0 2px var(--hi);padding:6px 9px 8px}
.sh{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;margin-bottom:4px}
.sh .v{margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:12px;background:#0a1020;border:2px solid #0a1020}
.bar i{display:block;height:100%;transition:width .4s steps(6);box-shadow:inset 0 3px 0 #ffffff55}
.stat.low{animation:low 1s steps(2) infinite}
@keyframes low{50%{box-shadow:inset 0 0 0 2px #ff5a6a}}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{appearance:none;-webkit-appearance:none;border:3px solid var(--line);background:#e8c98c;color:#3a2a2a;border-radius:0;
 box-shadow:inset 0 -5px 0 #b88a52,inset 0 3px 0 #fff3c0;padding:8px 2px 11px;font-size:14px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:70px}
.act:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #b88a52,inset 0 3px 0 #fff3c0}
.act:disabled{filter:grayscale(.85) brightness(.7)}
.act.on{background:#a9c6f0;box-shadow:inset 0 -5px 0 #5f82b8,inset 0 3px 0 #e4efff}
canvas.picon{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 0 0 2px var(--hi);padding:9px 11px;font-size:13px}
.xph{display:flex;justify-content:space-between;font-weight:700}
.xpbar{height:10px;background:#0a1020;margin-top:6px}
.xpbar i{display:block;height:100%;background:var(--gold);transition:width .4s;box-shadow:inset 0 3px 0 #fff6}
#log{margin:7px 0 0;color:#d8e5f8;min-height:1.4em}
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.toolbar.three{grid-template-columns:repeat(3,1fr)}
.dot{display:inline-block;width:9px;height:9px;background:#ff5a6a;border:2px solid #fff3d5;margin-left:4px;vertical-align:1px}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.plot{background:#14203a;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #3f5a88;padding:6px;text-align:center;font-size:12.5px}
.plot canvas{width:80px;height:64px;image-rendering:pixelated;display:block;margin:0 auto 4px}.plot .btn{width:100%;min-width:0;margin-top:4px;padding:10px 2px}
.goal{background:#14203a;border:2px solid var(--line);padding:8px 10px;margin-top:8px}.goal .gt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.goal .btn{flex:0 0 auto;min-width:72px}.goal.done{opacity:.6}.tool.big{background:#5a3f78;box-shadow:inset 0 0 0 2px #8a6ab0;font-size:14px;padding:11px 2px}
#battle{position:fixed;inset:0;z-index:15;background:#0e1528;overflow:auto;-webkit-overflow-scrolling:touch}
#battle .in{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:8px}
#bcv{display:block;width:100%;aspect-ratio:128/112;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--line);box-shadow:0 0 0 2px var(--hi)}
.hp{background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 0 0 2px var(--hi);padding:6px 9px;font-size:13px}
.hp .t{display:flex;justify-content:space-between;font-weight:700}.hp .bar i{background:#6ad06a}.hp.foe .bar i{background:#e86a6a}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}.moves .act{min-height:54px;font-size:14px;gap:2px}.moves .act small{font-size:11px;font-weight:700;opacity:.85}
.btn.bond{background:#ff6a9a;color:#fff;box-shadow:inset 0 -3px 0 #c03a6a,0 0 0 3px #ffd0e0;font-size:16px;animation:pulse .8s steps(2) infinite}@keyframes pulse{50%{box-shadow:inset 0 -3px 0 #c03a6a,0 0 0 6px #ff9ac0}}
#rpsZone{position:fixed;left:0;right:0;bottom:0;z-index:24;background:#101a30f0;border-top:3px solid var(--line);padding:12px 12px calc(12px + env(safe-area-inset-bottom));text-align:center;display:flex;flex-direction:column;gap:8px}#rpsMsg{font-size:18px;font-weight:900}.rpsbtns{display:flex;gap:8px}.rpsbtns button{flex:1;font-size:40px;min-height:84px;background:#2b4264;border:3px solid var(--line);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.rpsbtns button span{font-size:14px;font-weight:800}.rpsbtns button.pick{background:#ffd86a;color:#273753}#rpsBar{height:6px;background:#0008}#rpsBar i{display:block;height:100%;background:#ff8a5a;width:100%}
#tapZone{position:fixed;inset:0;z-index:25;background:#2a0a20cc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:none;-webkit-user-select:none;user-select:none;text-align:center}#tapZone b{font-size:72px;color:#ffd0e0}#tapMsg{font-size:22px;font-weight:900}
#blog{white-space:pre-line;min-height:2.8em;background:#fff9e8;color:#273753;border:3px solid #273753;padding:7px 10px;font-weight:700;font-size:14px;line-height:1.4}
.stagebtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-top:6px}
.eggrow{display:flex;gap:10px;align-items:center;background:#14203a;border:2px solid var(--line);padding:6px;margin-top:6px}.eggrow canvas{width:72px;height:72px;image-rendering:pixelated}
.prog{height:9px;background:#0a1020;margin:4px 0 8px}.prog i{display:block;height:100%;background:#7ccc5a}
ol.howto{padding-left:22px;margin:6px 0}ol.howto li{margin:4px 0}code{background:#0a1020;padding:1px 5px;word-break:break-all;font-size:12px}
.tool{background:#2b4264;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #50698f;padding:9px 2px;font-size:13px;font-weight:700;min-height:46px}
.tool:active{background:#22375a}
.hidden{display:none!important}
/* modal */
#modal{position:fixed;inset:0;background:#050a18cc;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#1d2c4a;border-top:4px solid #5a76a8;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);font-size:14px;line-height:1.6}
.sheet h2{margin:0 0 10px;font-size:18px}
.sheet p{margin:6px 0}
.sheet ul{margin:6px 0;padding-left:20px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1 1 auto;min-width:96px;background:#3a5580;border:2px solid var(--line);box-shadow:inset 0 -3px 0 #233a5e;padding:11px 10px;font-weight:800}
.btn.pri{background:#e8c98c;color:#3a2a2a;box-shadow:inset 0 -3px 0 #b88a52}
.btn.danger{background:#a8394c;box-shadow:inset 0 -3px 0 #6e1f30}
.sheet input[type=text],.sheet textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:2px solid var(--line);background:#fff9e8;color:#273753;border-radius:0}
.sheet textarea{height:84px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.err{color:#ff9aa8;min-height:1.2em;font-size:13px}
.codex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#14203a;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #3f5a88;padding:8px;text-align:center;font-size:12.5px;line-height:1.4}
.card canvas{width:96px;height:96px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.card b{font-size:14px}
.lean{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12.5px;margin-top:8px}
.lean .b{height:9px;background:#0a1020}.lean .b i{display:block;height:100%}
.sprites{overflow-x:auto;background:#7fb07a;padding:6px;border:2px solid var(--line)}
.sprites canvas{display:block;height:96px;image-rendering:pixelated;margin-bottom:4px}
.small{font-size:12px;color:var(--muted)}
.foodbar{display:flex;gap:4px;margin:6px 0 0;overflow-x:auto}.foodbar .food{flex:1 0 60px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#1c2a46;border:2px solid var(--line);color:#fff;padding:5px 2px;font-size:12px;font-weight:700;min-height:44px}.foodbar .food.on{background:#ffd86a;color:#273753;border-color:#fff3a6}.foodbar canvas{height:24px;width:auto;image-rendering:pixelated}.foodbar small{font-size:11px;opacity:.85}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:#fff3d5;color:#273753;border:3px solid #273753;box-shadow:3px 3px 0 #0008;padding:8px 14px;font-size:14px;font-weight:700;z-index:30;max-width:90%;text-align:center;transition:opacity .3s}
#toast{pointer-events:none}#toast.off{opacity:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body.rm *{transition:none!important;animation:none!important}

/* ===== V1.21 木頭質感主題：深色胡桃木底、木板面板、淺色木頭按鈕 ===== */
:root{--bg:#1e130b;--panel:#6b4423;--line:#2a170a;--hi:#b07a44;--text:#fff3dc;--muted:#ecd6b4}
#app{background:repeating-linear-gradient(90deg,#2a1a0e 0 3px,#24160c 3px 41px,#2e1d10 41px 44px,#24160c 44px 88px)}
.wood,.stat,.panel,.tip,.item,.plot,.coin,.goal,.eggrow{background:repeating-linear-gradient(180deg,#7a4e2a 0 9px,#6e4524 9px 10px,#76492a 10px 19px,#683f22 19px 20px)!important;border:3px solid #2a170a!important;box-shadow:inset 0 0 0 2px #b8854e,inset 0 3px 0 2px #d9a066,0 3px 0 #120a04!important}
.stagewrap{border:7px solid #6b4423;box-shadow:0 0 0 3px #2a170a,inset 0 0 0 2px #2a170a,0 0 0 5px #b8854e,0 0 0 8px #2a170a,0 8px 0 6px #0009;margin:8px 6px 6px}
.stagewrap::before,.stagewrap::after{content:'';position:absolute;width:7px;height:7px;background:#e8c070;box-shadow:inset -2px -2px 0 #8a5a2a;top:-7px;left:-7px;z-index:2}
.stagewrap::after{left:auto;right:-7px}
.act{background:repeating-linear-gradient(180deg,#e2b072 0 10px,#d6a264 10px 11px)!important;color:#3a2210!important;border:3px solid #2a170a!important;box-shadow:inset 0 -5px 0 #a8703e,inset 0 3px 0 #ffe2a8,0 3px 0 #120a04!important}
.act:active{box-shadow:inset 0 -2px 0 #a8703e,inset 0 3px 0 #ffe2a8!important}
.act.on{background:repeating-linear-gradient(180deg,#9cd47a 0 10px,#8cc46a 10px 11px)!important;box-shadow:inset 0 -5px 0 #5a9440,inset 0 3px 0 #e0ffc8!important}
.btn{background:repeating-linear-gradient(180deg,#8a5a32 0 8px,#7e5230 8px 9px);border:3px solid #2a170a;box-shadow:inset 0 -3px 0 #4a2c14,inset 0 2px 0 #c08850;color:#fff3dc}
.btn.pri{background:repeating-linear-gradient(180deg,#f0c27a 0 8px,#e4b46c 8px 9px);color:#3a2210;box-shadow:inset 0 -3px 0 #a8703e,inset 0 2px 0 #fff0c8}
.btn:disabled{filter:grayscale(.6) brightness(.75)}
.sheet{background:repeating-linear-gradient(180deg,#5a381c 0 12px,#52331a 12px 13px);border-top:6px solid #b8854e;box-shadow:0 -3px 0 #2a170a}
.viewbtn{background:#5a381ce6;border:3px solid #2a170a;box-shadow:inset 0 0 0 2px #b8854e}
.bar,.xpbar{background:#2a170a;border-color:#2a170a}
.foodbar .food{background:repeating-linear-gradient(180deg,#7a4e2a 0 8px,#6e4524 8px 9px);border:3px solid #2a170a;box-shadow:inset 0 0 0 2px #b8854e}
.foodbar .food.on{background:#ffd86a;color:#3a2210}.foodbar .food.fresh canvas,.item.fresh canvas{filter:drop-shadow(0 0 2px #fff3a0) drop-shadow(0 0 4px #ffd84a);animation:shine 1.2s ease-in-out infinite alternate}@keyframes shine{to{filter:drop-shadow(0 0 1px #fff3a0) drop-shadow(0 0 7px #ffe066)}}
#battle{background:repeating-linear-gradient(90deg,#2a1a0e 0 3px,#24160c 3px 41px)}
#rpsZone{background:#2a170af2;border-top:4px solid #b8854e}.rpsbtns button{background:repeating-linear-gradient(180deg,#8a5a32 0 8px,#7e5230 8px 9px);border:3px solid #2a170a;box-shadow:inset 0 0 0 2px #c08850}
.shoptabs .btn.on{background:#ffd86a;color:#3a2210}
.tool,.tool.big{background:repeating-linear-gradient(180deg,#8a5a32 0 8px,#7e5230 8px 9px)!important;border:3px solid #2a170a!important;box-shadow:inset 0 0 0 2px #c08850,inset 0 -3px 0 2px #4a2c14,0 3px 0 #120a04!important;color:#fff3dc}
.tool.big{background:repeating-linear-gradient(180deg,#a0683a 0 8px,#946036 8px 9px)!important}
</style>
</head>
<body>
<div id="app">
 <header>
  <div><h1>幻獸日記</h1><div class="ver">PIXEL FAMILIAR · V<span id="ver"></span></div></div>
  <div class="coin" aria-label="金幣"><canvas class="picon" data-icon="coin" data-s="2"></canvas><span id="coins">0</span></div>
 </header>
 <div id="saveWarn" class="tip warn hidden">⚠️ 目前無法寫入存檔（可能開啟了「私密瀏覽」）。請改用一般分頁，或到「存檔」匯出存檔碼保存。</div>
 <div id="homeTip" class="tip hidden">📲 想玩得像 App？點 Safari 下方的「分享」⬆️ →「加入主畫面」。<br><span class="small">提醒：主畫面版與 Safari 版的存檔彼此獨立，可用「存檔」功能搬移。</span><button id="homeTipX" aria-label="關閉">✕</button></div>
 <div class="stagewrap">
  <canvas id="scene" width="128" height="112" role="button" tabindex="0" aria-label="遊戲畫面，點擊幻獸互動"></canvas>
  <div id="bubble" class="off"></div>
  <button id="viewBtn" class="viewbtn hidden">🏠 進屋</button>
  <button id="lightBtn" class="viewbtn hidden" style="top:56px">💡 開燈</button>
 </div>
 <div id="foodBar" class="foodbar hidden"></div>
 <div class="nameplate"><div id="petname"></div><div id="stageText"></div><div id="traitText"></div><div id="growText"></div></div>
 <div class="stats" id="stats"></div>
 <div class="actions">
  <button class="act" data-act="feed"><canvas class="picon" data-icon="apple"></canvas>餵食</button>
  <button class="act" data-act="play"><canvas class="picon" data-icon="ball"></canvas>玩耍</button>
  <button class="act" data-act="wash"><canvas class="picon" data-icon="sponge"></canvas>洗澡</button>
  <button class="act" data-act="sleep" id="sleepBtn"><canvas class="picon" data-icon="moon" id="sleepIcon"></canvas><span id="sleepLabel">睡覺</span></button>
 </div>
 <section class="panel">
  <div class="xph"><span>⭐ 成長經驗</span><span id="xptext"></span></div>
  <div class="xpbar"><i id="xpbar"></i></div>
  <p id="log">照顧幻獸，陪伴牠成長！</p>
  <div class="small" id="stepInfo"></div>
 </section>
 <nav class="toolbar three">
  <button class="tool big" id="bAdv">⚔️ 冒險</button>
  <button class="tool big" id="bFarm">🌱 家園</button>
  <button class="tool big" id="bShop">🛒 商店</button>
  <button class="tool big" id="bGoals">🎯 目標<span id="goalDot" class="dot hidden"></span></button>
  <button class="tool big" id="bSteps">👟 步數</button>
  <button class="tool big" id="bMate">💞 配對</button>
 </nav>
 <nav class="toolbar">
  <button class="tool" id="bRename">✏️ 改名</button>
  <button class="tool" id="bCodex">📖 圖鑑</button>
  <button class="tool" id="bSave">💾 存檔</button>
  <button class="tool" id="bMenu">⚙️ 選單</button>
 </nav>
</div>
<div id="battle" class="hidden"><div class="in">
 <div class="hp foe"><div class="t"><span id="fName"></span><span id="fHp"></span></div><div class="bar"><i id="fBar"></i></div></div>
 <canvas id="bcv" width="128" height="112"></canvas>
 <div class="hp"><div class="t"><span id="mName"></span><span id="mHp"></span></div><div class="bar"><i id="mBar"></i></div></div>
 <div id="blog"></div>
 <button class="btn bond hidden" id="mvBond" data-mv="bond">💗 羈絆之力！為牠打氣（連打螢幕）</button>
 <div class="moves" id="moves">
  <button class="act" data-mv="tackle" id="mvTk">💥 撞擊</button>
  <button class="act" data-mv="special" id="mvSp">✨ 屬性技</button>
  <button class="act" data-mv="charge" id="mvCh">⚡ 蓄力</button>
  <button class="act" data-mv="guard">🛡️ 防禦<small>傷害減半、回復 8%</small></button>
  <button class="act" data-mv="potion" id="mvPo">🧪 藥水</button>
  <button class="act" data-mv="run">🏃 逃跑<small>沒有獎勵</small></button>
 </div>

'use strict';
/* =========================================================
   幻獸日記 Pixel Familiar — V1.3

const VERSION='1.22.0';
const SAVE_KEY='pixel-familiar-save',BACKUP_KEY='pixel-familiar-save-backup',LEGACY_KEY='pixel-familiar-v1',TIP_KEY='pixel-familiar-tip-closed';
const W=128,H=112,CELL=48,PET_X=40,PET_Y=56;           // 場景邏輯解析度與角色格位置
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));
const num=(v,d,a,b)=>{v=Number(v);return Number.isFinite(v)?clamp(v,a,b):d};
const chars=t=>Array.from(String(t));
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- 安全儲存（失敗時退回記憶體，不讓遊戲當掉） ---------------- */
const store={ok:true,mem:{},
 get(k){try{return localStorage.getItem(k)}catch(e){this.ok=false;return k in this.mem?this.mem[k]:null}},
 set(k,v){try{localStorage.setItem(k,v);return true}catch(e){this.ok=false;this.mem[k]=v;return false}},
 del(k){try{localStorage.removeItem(k)}catch(e){}delete this.mem[k]}};

/* ---------------- 規則核心（game-core.js，可單獨做單元測試） ---------------- */
const PC=window.PFCore;if(window.PF_NO_TRAITS)PC.CONFIG.traitsOn=false;   // 測試用：關掉屬性特性，數值才固定
const {CONFIG,ROUTES,makeGenome,CLASSIC_G,encodeGenome,decodeGenome,G_SIDE,gidOf,genomeFromId,formCode,fresh,sanitize}=PC;
const FORMS={egg:{name:'神秘的蛋',stage:0}};
const STAGE_NAME={egg:'蛋',baby:'嬰兒期',juvenile:'幼年期',adolescent:'少年期',adult:'成年期',ascended:'高階'};
const ROUTE_ICON={flame:'🔥',tide:'💧',forest:'🌿',earth:'🪨',bird:'🐦',elec:'⚡',metal:'⚙️'},ROUTE_LABEL={flame:'焰系',tide:'潮系',forest:'森系',earth:'土系',bird:'鳥系',elec:'電系',metal:'金系'};
const BOND_UNLOCK={20:'解鎖：撒嬌表情與早安問候',50:'解鎖：每天的小禮物',80:'解鎖：心之羈絆（戰鬥中撐住一次）'};

/* ---------------- 物種外觀（由基因產生） ---------------- */
function hsl(h,s,l){h=((h%360)+360)%360;s=clamp(s)/100;l=clamp(l)/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
 return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
const HUE_NAMES=[[15,'緋','Scarlet'],[40,'焰','Blaze'],[65,'琥','Amber'],[95,'苔','Moss'],[150,'翠','Jade'],[185,'湖','Lagoon'],[215,'霜','Frost'],[250,'夜','Night'],[285,'紫','Violet'],[320,'霞','Dusk'],[345,'桃','Peach'],[361,'緋','Scarlet']];
const SIDE_NAMES={nubs:['角','Nub'],horns:['角','Horn'],leaves:['葉','Leaf'],ears:['耳','Ear'],bunny:['兔','Bun'],none:['絨','Fluff']};
const ROUTE_NAMES={flame:['焰','Flame'],tide:['潮','Tide'],forest:['森','Forest'],earth:['岩','Terra'],bird:['翼','Sky'],elec:['雷','Volt'],metal:['鋼','Steel']};
const CLASSIC_NAMES={juv:['露露獸','Lulu'],flame:['焰尾獸','Flametail'],tide:['潮靈獸','Tidewisp'],forest:['森語獸','Forestsong'],earth:['岩甲獸','Rockshell'],bird:['風翼獸','Windwing'],elec:['雷光獸','Sparkling'],metal:['鋼鎧獸','Steelguard']};
const RARITY=['','普通','稀有','傳說'],STARS=['','★','★★','★★★'];
const EL_HUE={flame:[10,72],tide:[205,62],forest:[112,50],earth:[28,42,48],bird:[198,48,66],elec:[48,85,58],metal:[215,14,62]};   // 屬性的基本色相、飽和度、（亮度）
const EGG_EL={flame:'火焰',tide:'流水',forest:'森林',earth:'大地',bird:'天空',elec:'雷電',metal:'鋼鐵'};
/* 外觀代碼：juv[-屬性] 幼年／teen[-屬性] 少年／屬性 成年／asc-屬性 高階 */
function parseCode(code){const[a,b]=String(code).split('-');if(a==='baby')return{lv:-1,route:b||null};if(a==='juv')return{lv:0,route:b||null};if(a==='teen')return{lv:1,route:b||null};if(a==='asc')return{lv:3,route:b||null};return{lv:2,route:ROUTES.includes(a)?a:null}}
function codeRoute(code){return parseCode(code).route}
function speciesName(G,code,classic){const{lv,route}=parseCode(code),asc=lv===3,full=lv>=2&&route;
 if(classic){const b=CLASSIC_NAMES[full?route:'juv'];return{name:(asc?'聖':'')+b[0],en:(asc?'Ascended ':'')+b[1]}}
 const hn=HUE_NAMES.find(([m])=>G.hue<m),sn=SIDE_NAMES[G.side],pre=(asc?'聖':'')+(G.rarity===3?'星':''),epre=(asc?'Ascended ':'')+(G.rarity===3?'Star ':'');
 return full?{name:pre+hn[1]+sn[0]+ROUTE_NAMES[route][0]+'獸',en:`${epre}${hn[2]} ${sn[1]} · ${ROUTE_NAMES[route][1]}`}:{name:pre+hn[1]+sn[0]+'獸',en:`${epre}${hn[2]} ${sn[1]}`}}
/* 同一個屬性一路長大：幼年＝屬性配色＋尾巴，少年＋頭冠，成年＋完整部位，高階＋翅膀與光芒 */
function genomeForm(G,code='juv',classic=false){
 const{lv:lv0,route}=parseCode(code),lv=Math.max(0,lv0),asc=lv===3,grow=lv;
 const EH=EL_HUE[route];   // 身體顏色跟著屬性：每隻還是有些微差異
 const h=EH?(EH[0]+((G.hue*7)%36)-18+360)%360:G.hue,s=EH?clamp(EH[1]+(G.sat-60)/3,8,95):G.sat;
 const ah=route==='flame'?40:route==='tide'?195:route==='forest'?95:route==='earth'?30:route==='bird'?205:route==='elec'?52:route==='metal'?210:G.acc,gold=G.rarity===3||asc;
 const RA={earth:['#b8946a','#7a5a3a','#c8b8a0','#8a7a68'],bird:['#f4faff','#9ac4e8','#ffffff','#b0c8e0'],elec:['#ffe040','#e09a00','#fff3a0','#d8a020'],metal:['#d8e0e8','#8a98a8','#eef2f6','#a0aab8']}[route];
 const pal={o:hsl(h,35,13),b:hsl(h,s,56),d:hsl(h,s,38),l:hsl(h,s-5,75),feet:hsl(h,s-5,75),pat:hsl(h,s+10,42),
  belly:G.pattern==='belly'?hsl(G.acc,60,86):hsl(EH?h+20:G.bh,45,91),bellyD:G.pattern==='belly'?hsl(G.acc,50,74):hsl(EH?h+20:G.bh,35,79),
  horn:gold?'#ffe680':hsl(ah,70,76),hornD:gold?'#d9a441':hsl(ah,60,52),acc:gold&&!route?'#ffd34a':hsl(ah,80,68),accD:gold&&!route?'#e0902a':hsl(ah,70,48)};
 if(EH&&EH[2]){pal.b=hsl(h,s,EH[2]);pal.d=hsl(h,s,EH[2]-18);pal.l=hsl(h,s,EH[2]+18);pal.feet=pal.l}
 if(RA){pal.acc=RA[0];pal.accD=RA[1];if(!gold){pal.horn=RA[2];pal.hornD=RA[3]}}
 const feat=[],add=f=>{if(f&&f!=='none'&&!feat.includes(f))feat.push(f)};
 let side=G.side,top=G.top,tail=G.tail;
 if(lv===1&&!route&&top==='none')top='tuft';
 const M={flame:{tail:'flame',top:'crest'},tide:{tail:'fin',top:'antenna'},forest:{tail:'leaf',top:'flower'},earth:{tail:'club',top:'rockcrest'},bird:{tail:'feather',top:'plume'},elec:{tail:'bolt',top:'zap'},metal:{tail:'blade',top:'helm'}}[route];
 if(M){tail=M.tail;                                                   // 幼年期：屬性尾巴
  if(lv>=1){if(M.top==='helm')add('helm');else if(['flame','tide','forest'].includes(route)?(top==='none'||top==='tuft'):true)top=M.top}   // 少年期：頭冠
  if(lv>=2){                                                          // 成年期：完整部位
   if(route==='flame'&&(side==='nubs'||side==='none'))side='horns';
   if(route==='tide')add('fins');
   if(route==='forest')add('wings');
   if(route==='earth'&&(side==='nubs'||side==='none'||side==='leaves'))side='horns';
   if(route==='bird'){add('wings');if(side==='horns'||side==='nubs')side='none'}
   if(route==='elec')add('sparkcheek');
   if(route==='metal'&&(side==='nubs'||side==='none'||side==='leaves'))side='horns'}}
 add(side);add(top);if(G.wings||asc)add('wings');
 if(G.pattern==='spots'||G.pattern==='stripes')add('pat-'+G.pattern);if(gold)add('sparkle');if(G.eyes==='big')add('bigeyes');
 const nm=speciesName(G,code,classic);
 return{name:nm.name,en:nm.en,rx:G.rx+grow,ry:G.ry+grow,feat,tail,pal,genome:G,code,classic,route}}

/* ---------------- 存檔（localStorage；資料檢查與遷移在 game-core.js） ---------------- */
function parse(raw){if(!raw)return null;try{const o=JSON.parse(raw);return o&&typeof o==='object'?o:null}catch(e){return null}}
function load(){
 const main=store.get(SAVE_KEY);let o=parse(main);if(o)return{s:sanitize(o),src:'main'};
 o=parse(store.get(BACKUP_KEY));if(o)return{s:sanitize(o),src:main?'backup-corrupt':'backup'};
 o=parse(store.get(LEGACY_KEY));if(o)return{s:sanitize(o),src:'legacy'};
 return{s:fresh(),src:'new'}}
let s,lastBackup=0,lastSave=0;
/* 多分頁保護：如果別的分頁（例如捷徑開啟的新分頁）已經存了更新的進度，就採用它，不用舊資料覆蓋 */
function save(){
 const cur=parse(store.get(SAVE_KEY));if(cur&&Number(cur.rev)>s.rev){s=sanitize(cur);lastSave=Date.now();renderUI();return}
 s.rev++;s.updated=Date.now();lastSave=s.updated;
 if(s.updated-lastBackup>60000){const prev=store.get(SAVE_KEY);if(prev&&parse(prev))store.set(BACKUP_KEY,prev);lastBackup=s.updated}
 const ok=store.set(SAVE_KEY,JSON.stringify(s));$('saveWarn').classList.toggle('hidden',ok)}

/* ---------------- 時間（離線模擬規則在 game-core.js） ---------------- */
let clockWarned=false;
function handleTime(r){if(!r)return;
 if(r.events&&r.events.length&&s.hatched){if(r.events.includes('toilet'))setTimeout(()=>toast('🚽 牠自己去上廁所了，好乖！',3000),200);
  if(r.events.includes('poop')&&r.hours<.05){say('嗯嗯…💩 大便了！快點一下清掉');sfx('crack')}}if(r.warn==='back'&&!clockWarned){clockWarned=true;toast('⚠️ 裝置時間好像倒退了，遊戲不會回溯進度',4000)}
 if(r.warn==='jump')toast('⚠️ 離開很久了：離線變化最多只計算 12 小時',4000)}
function tick(){const r=PC.applyTime(s,Date.now());handleTime(r);return r}

/* =========================================================
   像素繪圖核心：grid → 自動描邊 → ImageData
   ========================================================= */
function grid(w,h){return{w,h,a:new Array(w*h).fill(0)}}
function px(g,x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<g.w&&y<g.h)g.a[y*g.w+x]=c}
function get(g,x,y){return x>=0&&y>=0&&x<g.w&&y<g.h?g.a[y*g.w+x]:0}
function ellipse(g,cx,cy,rx,ry,fn){
 for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
  const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry;if(nx*nx+ny*ny<=1){const c=fn(x,y,nx,ny);if(c)px(g,x,y,c)}}}
function outline(g,col){const b=g.a.slice();for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){if(b[y*g.w+x])continue;
 if((x>0&&b[y*g.w+x-1])||(x<g.w-1&&b[y*g.w+x+1])||(y>0&&b[(y-1)*g.w+x])||(y<g.h-1&&b[(y+1)*g.w+x]))g.a[y*g.w+x]=col}}
const rgbCache={};
function rgb(h){if(rgbCache[h])return rgbCache[h];const n=parseInt(h.slice(1),16);return rgbCache[h]=[n>>16&255,n>>8&255,n&255]}
function blit(g,img,ox,oy=0){for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){const c=g.a[y*g.w+x];if(!c)continue;
 const i=((oy+y)*img.width+ox+x)*4,[r,gg,b]=rgb(c);img.data[i]=r;img.data[i+1]=gg;img.data[i+2]=b;img.data[i+3]=255}}
function gridCanvas(g){const cv=document.createElement('canvas');cv.width=g.w;cv.height=g.h;const ctx=cv.getContext('2d');const img=ctx.createImageData(g.w,g.h);blit(g,img,0);ctx.putImageData(img,0,0);return cv}

/* ---------------- 角色逐格畫格定義 ---------------- */
const FRAMES={
 idle0:{},idle1:{sx:1.04,sy:.94},blink:{eye:'blink'},
 eat0:{mouth:'open'},eat1:{mouth:'chew',eye:'happy',sx:1.05,sy:.95},eat2:{mouth:'o',eye:'happy'},
 jump0:{sx:1.14,sy:.84,eye:'happy'},jump1:{sx:.92,sy:1.1,dy:-6,eye:'happy',mouth:'open',feet:'tuck',wing:1},

};
const FRAME_NAMES=Object.keys(FRAMES);
const ANIMS={
 idle:{f:['idle0','idle0','idle1','idle1'],fps:2.5},
 sleep:{f:['sleep0','sleep0','sleep1','sleep1'],fps:1.5},
 sad:{f:['sad0','sad0','sad1','sad1'],fps:2},

};

/* ---------------- 程式化像素角色繪製 ---------------- */
function drawCreature(F,fr){
 const g=grid(CELL,CELL),P=F.pal,has=k=>F.feat.includes(k);
 const sx=fr.sx||1,sy=fr.sy||1,dx=fr.dx||0,dy=Math.round((fr.dy||0)*(F.ry>12?.6:1)),eye=fr.eye||'open',mouth=fr.mouth||'smile';
 const rx=F.rx*sx,ry=F.ry*sy,ground=44+dy,cxi=24+dx,cx=cxi,cy=ground-3-ry+1,top=Math.round(cy-ry);
 const pm=(x,y,c)=>{px(g,x,y,c);px(g,2*cxi-1-x,y,c)};          // 左右鏡射
 const rect=(x,y,w,c,m)=>{for(let i=0;i<w;i++)(m?pm:(a,b,cc)=>px(g,a,b,cc))(x+i,y,c)};
 // --- 身體後方：翅膀、尾巴 ---
 if(has('wings')){const up=fr.wing?-3:0;
  for(let k=0;k<7;k++){const y=Math.round(cy-1-k+up*(k/6));const x0=Math.round(cx-rx-1-k*.9),x1=Math.round(cx-rx+4);
   for(let x=x0;x<=x1;x++)pm(x,y,x===x0?P.accD:(k%2?P.acc:P.l))}}
 const tb=[[0,0],[2,0],[4,-1],[5,-3],[5,-5],[4,-6]],wag=fr.tail?1:0;
 const tx0=Math.round(cx+rx-5),ty0=Math.round(cy+ry*.4);let tip=[0,0];
 const tcount=F.tail==='none'?1:F.tail==='fluffy'?3:tb.length;
 tb.slice(0,tcount).forEach(([ox,oy],i)=>{const sh=i>=3?wag:0,X=tx0+ox+sh,Y=ty0+oy-sh;tip=[X,Y];
  for(let a=0;a<3;a++)for(let b=0;b<3;b++)px(g,X+a,Y+b,b===2?P.d:(i===tb.length-1&&F.tail==='small'?P.acc:P.b))});
 const [tx,ty]=tip;
 if(F.tail==='fluffy')ellipse(g,tx+3,ty,4.2,4,(x,y,nx,ny)=>nx*.5+ny*.7>.5?P.d:((nx+.4)**2+(ny+.4)**2<.12?'#ffffff':P.l));
 if(F.tail==='flame'){rect(tx+1,ty-4,1,P.acc);rect(tx,ty-3,3,P.acc);rect(tx-1,ty-2,4,P.accD);rect(tx-1,ty-1,5,P.accD);px(g,tx+1,ty-2,'#fff6c8');px(g,tx+1,ty-1,P.acc);px(g,tx+2,ty-1,P.acc)}
 if(F.tail==='fin'){for(let r=0;r<5;r++)for(let x=0;x<=r+1;x++)px(g,tx+2+x,ty-3+r,x%2?P.accD:P.acc)}
 if(F.tail==='club'){ellipse(g,tx+4,ty-2,3.6,3.4,(x,y,nx,ny)=>nx*.5+ny*.6>.3?P.accD:P.acc);px(g,tx+3,ty-3,'#e8d8c0')}
 if(F.tail==='feather'){for(let k=0;k<3;k++){const ox=tx+2+k*2,oy=ty-4+k;for(let j=0;j<4;j++){px(g,ox+j,oy-j+k,j===0?P.accD:P.acc)}}px(g,tx+2,ty-1,P.accD)}
 if(F.tail==='bolt'){[[0,0],[1,-1],[2,-2],[1,-3],[2,-3],[3,-4],[4,-5],[3,-6],[4,-6],[5,-7]].forEach(([a,b],i)=>{px(g,tx+2+a,ty-1+b,i%3===0?P.accD:P.acc);px(g,tx+3+a,ty-1+b,P.acc)})}
 if(F.tail==='blade'){for(let k=0;k<6;k++)for(let j=0;j<=Math.floor(k/2);j++)px(g,tx+2+k,ty-2-j,j===0?P.accD:(k%2?P.acc:'#ffffff'))}
 if(F.tail==='leaf'){rect(tx+2,ty-4,2,P.acc);rect(tx+1,ty-3,4,P.acc);rect(tx+1,ty-2,4,P.acc);rect(tx+2,ty-1,2,P.acc);px(g,tx+3,ty-3,P.accD);px(g,tx+2,ty-2,P.accD)}
 // --- 腳 ---
 const fy=fr.feet==='tuck'?ground-3:ground-1,fxo=Math.round(rx*.5);
 ellipse(g,cx-fxo,fy,3.2,2.2,(x,y,nx,ny)=>ny>.3?P.d:P.feet);ellipse(g,cx+fxo,fy,3.2,2.2,(x,y,nx,ny)=>ny>.3?P.d:P.feet);
 // --- 身體（光源左上） ---
 ellipse(g,cx,cy,rx,ry,(x,y,nx,ny)=>nx*.55+ny*.8>.62?P.d:((nx+.42)**2+(ny+.55)**2<.08?P.l:P.b));
 ellipse(g,cx,cy+ry*.5,rx*.56,ry*.42,(x,y,nx,ny)=>ny>.45||nx>.62?P.bellyD:P.belly);
 const onBody=(x,y)=>{const c=get(g,Math.round(x),Math.round(y));return c===P.b||c===P.d||c===P.l};

const lvl=()=>PC.level(s.xp);
/* 每次有變化後：檢查等級顯示與成長階段 */
function afterChange(x0){
 const L0=PC.level(x0),L1=lvl();
 if(L1>L0){say(`升到 Lv.${L1}！`,{q:true});sfx('level');spawn('star',6,{y:70,vy:-30,jx:40,life:1.3})}
 runStages()}
const evoQueue=[];
function runStages(){if(!s.hatched)return;const tr=PC.checkStages(s,Date.now());if(!tr.length)return;save();evoQueue.push(...tr);if(!evo)setTimeout(nextEvo,600)}
function nextEvo(){
 const t=evoQueue.shift();if(!t){renderUI();return}if(evo){evoQueue.unshift(t);return}
 const id=gidOf(s),fromK=petKey(id,formCode(t.from,t.route)),toK=petKey(id,formCode(t.to,t.route)),TF=formOf(toK);
 busyUntil=Date.now()+(rm()?600:3300);sfx('evolve');say(t.to==='ascended'?'全身發出耀眼的光芒…':'咦？！身體在發光…',{log:false});
 evo={from:fromK,to:toK,t0:performance.now()-(rm()?2600:0),done:()=>{spawn('star',12,{y:70,vy:-34,jx:60,life:1.6});spawn('spark',8,{y:72,jx:50,life:1});playAnim('happy');renderUI();
  const msg=`${s.name} 長成${STAGE_NAME[t.to]}「${TF.name}」了！`;say(msg);toast(`🎉 ${STAGE_NAME[t.to]}：${TF.name}（${TF.en}）`,3500);setTimeout(nextEvo,1500)}}}
function gatherOffer(){confirmBox('🌿 去採集？','沒有食物、金幣也不夠時，可以免費採集果子（每 2 分鐘一次），不會卡關。','採集',()=>{const g=PC.gather(s,Date.now());toast(g.msg);save();renderUI()})}
function act(a){
 if(!s.hatched||evo)return;unlockAudio();
 if(a==='sleep'){if(Date.now()<busyUntil||modeBusy()||petTarget!==null)return;cancelMode();
  if(!s.sleeping&&curView()!=='room'){toast('🪺 外面不能睡覺，帶牠回小窩睡囉',2500);s.view='room';petX=PET_X;save();renderUI();setTimeout(()=>act('sleep'),700);return}
  const goSleep=()=>{const x0=s.xp,r=PC.act(s,'sleep',Date.now());handleTime(r.tm);if(!r.ok){say(r.msg);return}
   if(s.sleeping){busyUntil=Date.now()+500;spawn('z',2,{x:petX+36,y:62,vx:6,vy:-8,jx:2,jy:2,life:2,spread:4})}else{playAnim('happy');homeAt=performance.now()+800}
   sfx(r.sfx);say(r.msg);save();renderUI();afterChange(x0)};
  if(!s.sleeping&&s.decor.placed.bed){say('走回床上…',{log:false});walkTo(BED_X,goSleep)}else goSleep();return}
 if(mode===a){if(modeBusy())return;setMode(null);say('先不要了～',{log:false});renderUI();return}
 if(mode&&modeBusy())return;
 const why=PC.canAct(s,a,Date.now());
 if(s.sleeping){say('噓…牠在睡覺，按「睡覺」叫醒牠才能'+({feed:'吃東西',play:'玩',wash:'洗澡'}[a]||'做這件事'));sfx('no');return}   // 睡覺時不播放睜眼動畫
 if(why){say(why);playAnim('no');sfx('no');if(a==='feed'&&PC.canGather(s,Date.now()))setTimeout(gatherOffer,500);return}
 setMode(a);say(MODE_TIP[a]);sfx('tap');renderUI();
 const r=cv.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)cv.scrollIntoView({block:'start',behavior:rm()?'auto':'smooth'})}
function tapPet(){
 unlockAudio();requestPersist();if(evo||Date.now()<busyUntil)return;
 if(!s.hatched){tick();s.eggTaps++;wobbleUntil=performance.now()+450;sfx(s.eggTaps>=2?'crack':'tap');buzz(10);
  if(s.eggTaps>=5){hatch();return}say(['蛋動了一下！','喀…出現裂痕了！','裂得更大了！','快出來了！再一下！'][s.eggTaps-1]);save();renderUI();return}
 const x0=s.xp,r=PC.pet(s,Date.now());handleTime(r.tm);
 if(s.sleeping){say(r.msg);return}
 const tierB=PC.bondTier(s.bond);
 if(r.reward){playAnim(tierB>=1?'shy':'happy');sfx('pet');spawn('heart',3,{y:70,life:1.1,stagger:.12});
  say((tierB>=2?['最喜歡你了！💕','一直在一起喔～','（蹭蹭）']:tierB>=1?['嘿嘿～好舒服','（撒嬌）再摸摸～','呼嚕呼嚕～']:['呼嚕～好舒服 💕','嘿嘿～','再摸一下嘛～'])[Math.floor(Math.random()*3)]+'　親密度 +2')}
 else{playAnim('happy');sfx('tap');spawn('heart',1,{y:70,life:.8});say('嘿嘿～',{log:false});$('log').textContent='（30 分鐘內再摸只會撒嬌，不會增加親密度）'}
 if(r.bondUp)setTimeout(()=>toast(`💗 親密度 ${r.bondUp}！${BOND_UNLOCK[r.bondUp]}`,4000),300);
 if(r.gift)setTimeout(()=>{toast('🎁 牠撿了一顆果子送你！食物 +1',3500);spawn('apple',1,{y:70,vy:-20,life:1.2})},1200);
 for(const e of r.events||[])if(e)setTimeout(()=>toast(`🌙 發生了「${PC.EVENT_TEXT[e]}」事件！`,4000),2200);
 save();renderUI();afterChange(x0)}
function hatch(){const now=Date.now();PC.hatch(s,now);const HF=formOf(formKey());
 flashUntil=performance.now()+700;sfx('hatch');buzz(40);playAnim('happy',1400);spawn('star',10,{y:70,vy:-30,jx:60,life:1.5});spawn('spark',6,{y:74,jx:50});
 say(HF.classic?'啾！我出生了！🐣':`啾！我是新物種「${HF.name}」！${HF.genome.rarity>1?'（'+STARS[HF.genome.rarity]+' '+RARITY[HF.genome.rarity]+'）':''}`);
 if(HF.genome.rarity>1)spawn('star',10,{y:60,vy:-40,jx:80,life:1.8});save();renderUI();setTimeout(()=>renameDialog(true),1900)}

const STATS=[['hunger','飽食','apple','#f19a6a'],['mood','心情','heart','#f18fae'],['clean','清潔','tub','#73c9e6'],['energy','體力','bolt','#f2cc6e']];
function buildStats(){$('stats').innerHTML=STATS.map(([k,l,ic,c])=>`<div class="stat" id="st-${k}"><div class="sh"><canvas class="picon" data-icon="${ic}" data-s="2"></canvas>${l}<span class="v" id="sv-${k}"></span></div><div class="bar"><i id="sb-${k}" style="background:${c}"></i></div></div>`).join('')}
function dayCount(){return Math.floor((Date.now()-s.hatchedAt)/86400000)+1}
function growLine(){
 if(!s.hatched)return'';const now=Date.now(),q=PC.stageReq(s,now),hint=PC.tendencyHint(s);let g=`💗 親密度 ${Math.round(s.bond)}`;
 if(q){const left=[];if(!q.ageOk)left.push(`${Math.ceil(q.hours-q.age)} 小時`);if(!q.xpOk)left.push(`${q.xp-s.xp} XP`);if(!q.eventOk)left.push(`「${PC.EVENT_TEXT[PC.ROUTE_EVENT[s.route]]}」事件`);
  g+=left.length?` · 距離${STAGE_NAME[q.next]}：${left.join('、')}`:` · 即將長成${STAGE_NAME[q.next]}！`}
 return g+(hint?` · ${hint}`:'')}
function renderUI(){
 $('coins').textContent=s.coins;
 const F=formOf(formKey()),rar=F.genome&&F.genome.rarity>1&&!F.classic?` · ${STARS[F.genome.rarity]}${RARITY[F.genome.rarity]}`:'',tierN=PC.stepTier(s);
 $('petname').textContent=s.hatched?`${s.name}　Lv.${lvl()}${tierN?' '+'✦'.repeat(Math.min(5,tierN)):''}`:F.name;
 {const T=s.hatched&&PC.traitOf(s.route);$('traitText').textContent=T&&T.good?`✨ ${T.good}　⚠️ ${T.bad}`:''}
 $('stageText').textContent=!s.hatched?`輕點蛋 5 下來孵化（${s.eggTaps}/5）${F.genome&&F.genome.el?' · 會孵出'+ROUTE_LABEL[F.genome.el]+'的新物種':''}`:`${s.route?ROUTE_ICON[s.route]+ROUTE_LABEL[s.route]+' · ':''}${STAGE_NAME[s.stage]} · ${F.name}${rar} · 第 ${dayCount()} 天`;
 $('growText').textContent=growLine();
 $('stepInfo').textContent=`🍎 食物 ${s.inv.food} · 🌱 種子 ${s.inv.seeds}${s.inv.candy?' · 🍬 '+s.inv.candy:''}${s.inv.potion?' · 🧪 '+s.inv.potion:''} · 👟 今日 ${fmtN(s.steps.days[PC.dayKey(Date.now())]||0)} 步 · ⚔️ 今日冒險 ${s.daily.adv}${s.eggs.length?' · 🧺 蛋 '+s.eggs.length:''}`;
 for(const[k]of STATS){const v=s.hatched?s[k]:0;$('sv-'+k).textContent=s.hatched?Math.round(v)+'%':'--';$('sb-'+k).style.width=v+'%';$('st-'+k).classList.toggle('low',s.hatched&&v<20)}
 document.querySelectorAll('[data-act]').forEach(b=>b.disabled=!s.hatched);
 $('sleepLabel').textContent=s.sleeping?'叫醒':'睡覺';$('sleepBtn').classList.toggle('on',s.sleeping);
 const want=s.sleeping?'sun':'moon';if($('sleepIcon').dataset.icon!==want){$('sleepIcon').dataset.icon=want;paintIcon($('sleepIcon'),want)}
 const q=s.hatched&&PC.stageReq(s,Date.now()),goal=q?q.xp:0;
 $('xptext').textContent=!s.hatched?'—':q?(s.xp>=goal?`${s.xp} XP（${STAGE_NAME[q.next]} XP 已達標 ✓）`:`${s.xp} / ${goal} XP（${STAGE_NAME[q.next]}）`):`${s.xp} XP`;$('xpbar').style.width=(!s.hatched?0:q?Math.min(100,s.xp/goal*100):100)+'%';
 document.body.classList.toggle('rm',rm());
 $('viewBtn').classList.toggle('hidden',!s.hatched);$('viewBtn').textContent=s.view==='room'?'🌳 出門':'🪺 進窩';
 $('goalDot').classList.toggle('hidden',!(s.goals.list||[]).some(g=>!g.claimed&&g.n>=PC.GOALS[g.id].need))}

let modalOnClose=null;
function openModal(title,html,buttons=[{t:'關閉'}]){
 const sh=$('sheet');sh.innerHTML=`<h2>${title}</h2><div>${html}</div><div class="row" id="mbtns"></div>`;
 const row=$('mbtns');buttons.forEach(b=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');el.textContent=b.t;el.onclick=()=>{if(b.fn&&b.fn()===false)return;closeModal()};row.appendChild(el)});
 $('modal').classList.remove('hidden');sh.scrollTop=0}
function closeModal(){$('modal').classList.add('hidden');$('sheet').innerHTML='';const f=modalOnClose;modalOnClose=null;f&&f()}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function confirmBox(title,text,okText,fn,cls='pri'){openModal(title,`<p>${text}</p>`,[{t:'取消'},{t:okText,cls,fn}])}

function renameDialog(first){
 if(!s.hatched){say('先把蛋孵出來吧！');return}
 openModal(first?'🐣 為牠取個名字吧！':'✏️ 改名字',`<p class="small">最多 10 個字，可用中文、英文或 emoji。</p><input type="text" id="nameIn" maxlength="20" autocomplete="off" enterkeyhint="done"><div class="err" id="nameErr"></div>`,
  [{t:first?'就叫小露':'取消'},{t:'確定',cls:'pri',fn:()=>{const n=chars($('nameIn').value.trim()).slice(0,10).join('');if(!n){$('nameErr').textContent='名字不能是空白喔';return false}
   s.name=n;const de=s.dex.find(x=>x.id===gidOf(s));if(de)de.petName=n;save();renderUI();say(`我是「${n}」！請多指教～`);return true}}]);
 const inp=$('nameIn');inp.value=s.name;inp.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#mbtns .pri').click()})}

function checksum(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h.toString(36)}
function exportCode(){const b64=btoa(unescape(encodeURIComponent(JSON.stringify({app:'pixel-familiar',ver:VERSION,at:Date.now(),save:s}))));return'PF1.'+b64+'.'+checksum(b64)}
function decodeCode(code){code=String(code||'').replace(/\s+/g,'');
 if(code.startsWith('{')){const o=parse(code);return o&&(o.save||o)}
 const m=/^PF1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/.exec(code);if(!m)throw new Error('格式不正確');if(checksum(m[1])!==m[2])throw new Error('存檔碼不完整或被修改過');
 const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o||o.app!=='pixel-familiar'||!o.save)throw new Error('這不是幻獸日記的存檔');return o.save}
function fmtTime(t){if(!t)return'從未';const d=new Date(t);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

function playTap(){if(BALL.b){BALL.tapAt=performance.now();if(!anim.once)playAnim('header',450);return}
 if(BALL.left<=0)return;BALL.left--;BALL.b={x:clamp(petX+24+(Math.random()-.5)*60,16,100),y:-8,vx:(Math.random()-.5)*8,vy:0,hit:false,scored:false};sfx('tap')}
function endBall(){const b=BALL.b;if(!b)return;BALL.b=null;if(!b.scored)say(b.hit?(b.good?'差一點點！':'頂到了，可是偏掉了…'):'沒頂到…',{log:false});
 if(BALL.left<=0)setTimeout(finishPlay,700)}
function finishPlay(){if(mode!=='play')return;const x0=s.xp,sc=BALL.score,r=PC.finishBallGame(s,sc,Date.now());handleTime(r.tm);setMode(null);
 if(r.ok){playAnim(sc?'happy':'play');sfx(sc?'level':'play');say(`頂球結束：${sc} / ${CONFIG.ballGame.balls} 分${r.best?'　🏆 新紀錄！':''}`);
  if(r.popped){POP={x:petX+24,y:PET_Y+18,t0:performance.now()};setTimeout(()=>{sfx('no');buzz(30);say(`💥 球被玩壞，爆掉了！下次玩要花 ${CONFIG.ballCost} 金幣買新球`)},1200)}$('log').textContent=`頂球 ${sc} 分（最佳 ${s.ball.best} 分）　${r.msg}${r.xp?'　經驗 +'+r.xp:''}`}
 else say(r.msg);save();renderUI();afterChange(x0)}
/* 球爆掉的動畫：先鼓起來、再炸成碎片 */
let POP=null;
function drawPop(now){if(!POP)return;const e=(now-POP.t0)/1000-1.1;if(e<0)return;if(e>1){POP=null;return}const{x,y}=POP;
 if(e<.25){const r=4+e*20;ctx.fillStyle='#f0505a';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle='#ffffff';ctx.fillRect(Math.round(x-r/2),Math.round(y-r/2),2,2);return}
 const k=(e-.25)/.75;ctx.globalAlpha=1-k;for(let i=0;i<10;i++){const a=i/10*Math.PI*2,d=6+k*26;ctx.fillStyle=i%2?'#ffffff':'#e8433f';ctx.fillRect(Math.round(x+Math.cos(a)*d),Math.round(y+Math.sin(a)*d+k*k*12),3,2)}
 ctx.fillStyle='#ffe066';for(let i=0;i<4;i++){const a=i/4*Math.PI*2+.4,d=3+k*10;ctx.fillRect(Math.round(x+Math.cos(a)*d),Math.round(y+Math.sin(a)*d),2,2)}ctx.globalAlpha=1}
function drawRing(){const{x,y,r}=RING;ctx.fillStyle='#6a4428';ctx.fillRect(x+r,y-2,2,104-y+2);
 ctx.strokeStyle='#ff8a2a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,r,r,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ffffffaa';ctx.lineWidth=1;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(x+k*4,y+r-2);ctx.lineTo(x+k*2,y+r+5);ctx.stroke()}}
function drawBall(){const b=BALL.b;if(!b)return;const ic=ICV.ball;ctx.drawImage(ic,Math.round(b.x-ic.width/2),Math.round(b.y-ic.height/2))}
function drawBallHUD(){if(mode!=='play')return;for(let i=0;i<BALL.left;i++)ctx.drawImage(ICV.ball,W-12-i*11,3);for(let i=0;i<BALL.score;i++)ctx.drawImage(ICV.star,3+i*11,3)}
/* ---- 畫面點擊 ---- */
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{const p=toLogical(e);unlockAudio();requestPersist();
 if(mode==='wash'){WASH.down=true;WASH.px=p.x;WASH.py=p.y;WASH.lastMove=performance.now();try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
 if(!mode&&nearToy(p.x,p.y)&&!coreAt(p.x,p.y)){toyGrab(p.x,p.y);try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
 pointerTap(p.x,p.y)});
/* 手指按在球上時不要讓頁面捲動 */
cv.addEventListener('touchstart',e=>{const t0=e.touches[0];if(!t0||mode)return;const p=toLogical(t0);if(nearToy(p.x,p.y)&&!coreAt(p.x,p.y))e.preventDefault()},{passive:false});
cv.addEventListener('pointermove',e=>{if(DRAG.on){const p=toLogical(e);toyDrag(p.x,p.y);return}if(mode!=='wash'||!WASH.down)return;const p=toLogical(e);if(Math.hypot(p.x-WASH.px,p.y-WASH.py)>.6)WASH.lastMove=performance.now();WASH.px=p.x;WASH.py=p.y});
for(const ev of['pointerup','pointercancel','pointerleave'])cv.addEventListener(ev,()=>{WASH.down=false;toyRelease()});
function pointerTap(x,y){if(evo)return;
 if(mode==='feed'){placeApple(x,y);return}
 if(mode==='play'){playTap();return}
 if(s.hatched&&tryClearCore(x,y))return;
 if(overPet(x,y)||(!s.hatched&&x>=PET_X&&x<=PET_X+CELL&&y>=PET_Y&&y<=PET_Y+CELL)){tapPet();return}
 if(s.hatched&&curView()==='yard'){const d=DEN_BOX[s.den.level-1];if(x>=d[0]&&x<=d[2]&&y>=d[1]&&y<=d[3]){denDialog();return}}
 spawn('spark',1,{x,y,vy:-6,jx:0,jy:0,life:.5,spread:0})}
cv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapPet()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));
$('bAdv').onclick=advDialog;$('bFarm').onclick=farmDialog;$('bGoals').onclick=goalsDialog;$('bShop').onclick=()=>shopDialog('decor');
$('viewBtn').onclick=()=>toggleView();
$('lightBtn').onclick=()=>{s.settings.light=s.settings.light===false;save();syncLightBtn(true);sfx('tap');say(s.settings.light?'💡 開燈了，暖暖的～':'關燈了，好暗喔…',{log:false})};
/* 開燈按鈕：只在小窩裡、傍晚到晚上出現 */
function syncLightBtn(force){const show=s.hatched&&curView()==='room'&&['night','dusk'].includes(phase()),b=$('lightBtn');b.classList.toggle('hidden',!show);if(show)b.textContent=s.settings.light===false?'💡 開燈':'🌙 關燈'}
setInterval(syncLightBtn,1000);$('bSteps').onclick=stepsDialog;$('bMate').onclick=mateDialog;
$('bRename').onclick=()=>renameDialog(false);$('bCodex').onclick=codexDialog;$('bSave').onclick=saveDialog;$('bMenu').onclick=menuDialog;
$('homeTipX').onclick=()=>{$('homeTip').classList.add('hidden');store.set(TIP_KEY,'1')};

/* ---------------- 啟動 ---------------- */
function init(){
 $('ver').textContent=VERSION;
 buildIcons();loadItems();buildPlots();cloudCv=gridCanvas(CLOUD);
 buildStats();document.querySelectorAll('canvas.picon').forEach(c=>paintIcon(c,c.dataset.icon));
 const raw=parse(store.get(SAVE_KEY)),upgraded=!!(raw&&!(Number(raw.v)>=6));
 const L=load();s=L.s;
 if(L.src==='new'&&window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)s.settings.reducedMotion=true;
 tick();
 let urlMsg='';try{const q=new URLSearchParams(location.search);if(q.has('steps')){urlMsg=stepResultMsg(creditSteps(q.get('steps'),q.get('d')));history.replaceState(null,'',location.pathname+location.hash)}}catch(e){}
 if(s.sleeping){s.view='room';petX=s.decor.placed.bed?BED_X:PET_X}
 save();renderUI();startLoop();setTimeout(runStages,1500);dailyCheck();
 if(upgraded)setTimeout(()=>toast('✅ 存檔已升級到 V1.6 新規則（等級改為累積經驗、加入成長階段）',4500),2600);
 if(urlMsg)setTimeout(()=>{toast(urlMsg,5000);spawn('shoe',3,{y:70,life:1.2,stagger:.2})},300);
 if(L.src==='legacy')toast('✅ 已自動搬移 V1.x 舊存檔');
 else if(L.src==='backup-corrupt')toast('⚠️ 主存檔損壞，已從備份還原');
 if(!store.ok)$('saveWarn').classList.remove('hidden');
 if(inFrame){const tp=$('homeTip');tp.innerHTML='🧪 這是 Claude 內的<b>快速試玩版</b>。存檔只留在這個頁面，可能被清除；正式遊玩請用 GitHub Pages 網址，並用「存檔」搬移進度。<button id="homeTipX" aria-label="關閉">✕</button>';tp.classList.remove('hidden');$('homeTipX').onclick=()=>tp.classList.add('hidden')}
 else if(isIOS&&!standalone()&&!store.get(TIP_KEY))$('homeTip').classList.remove('hidden');
 setTimeout(()=>say(s.hatched?(s.sleeping?'Zzz…':`${s.name}：歡迎回來！`):'輕點蛋看看？',{log:false}),400);
 let secs=0;setInterval(()=>{if(document.hidden)return;tick();renderUI();if(Date.now()-lastSave>15000)save();if(++secs%5===0&&!evo&&!B)runStages();
  if(Date.now()>nextChat&&!msgTimer&&$('modal').classList.contains('hidden'))say(chatter(),{log:false})},1000);
 if(!inFrame&&'serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude|anthropic/.test(location.hostname))
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
}
window.PF={get state(){return s},toy:TOY,arena:makeArena,bUI:()=>bUI(),get mode(){return mode},get ball(){return BALL},get apple(){return FEED.apple},get petX(){return petX},PC,makeDecor:id=>makeDecor(id),playAnim:(...a)=>playAnim(...a),formKey:()=>formKey(),creditSteps,mateCode,decodeMate,encodeGenome,decodeGenome,startBattle,onMove,get B(){return B},SHEETS,sheet,formOf,makeGenome,genomeForm,petKey,FORMS,FRAMES,ICV,exportCode,decodeCode,sanitize,VERSION,
 debug:{info(){return{busy:busyUntil-Date.now(),evo:!!evo,modal:!$('modal').classList.contains('hidden'),taps:s.eggTaps,h:s.hatched,battle:!!B}},skip(min){s.lastTick-=min*60000;tick();renderUI();save()},age(h){s.hatchedAt-=h*3600000;save();runStages();renderUI()},xp(n){const x0=s.xp;PC.addXP(s,n);save();renderUI();afterChange(x0)},set(o){Object.assign(s,o);renderUI();save()}}};
try{init()}catch(e){document.body.insertAdjacentHTML('afterbegin',`<div style="padding:12px;background:#a8394c;color:#fff">啟動錯誤：${esc(e.message)}</div>`);throw e}
