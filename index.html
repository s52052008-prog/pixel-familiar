<style>
:root{--bg:#0e1528;--panel:#1d2c4a;--line:#0a1020;--hi:#3f5a88;--text:#fff3d5;--muted:#b9c8e6;--gold:#f2c55c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:9px;
 padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 12px);
 background:linear-gradient(#1b2a48,#111a30)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:20px;letter-spacing:1px;white-space:nowrap}
.ver{font-size:10px;color:var(--muted);letter-spacing:2px}

.tip{background:#2b3f66;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #5a76a8;padding:8px 34px 8px 10px;font-size:12.5px;line-height:1.45;position:relative}
.tip button{position:absolute;right:0;top:0;background:none;border:0;font-size:16px;min-width:44px;min-height:44px}
.warn{background:#5a2232;box-shadow:inset 0 0 0 2px #c0465a}
.stagewrap{position:relative;border:3px solid var(--line);box-shadow:0 0 0 2px var(--hi),0 5px 0 2px #000c}
#scene{display:block;width:100%;aspect-ratio:128/112;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer;background:#6fb8e8}
#bubble{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:90%;width:max-content;background:#fff9e8;color:#273753;border:3px solid #273753;box-shadow:3px 3px 0 #0006;padding:5px 10px;font-size:14px;font-weight:700;text-align:center;line-height:1.35;transition:opacity .25s;pointer-events:none}
#bubble.off{opacity:0}
.nameplate{text-align:center;line-height:1.25}
#petname{font-size:20px;font-weight:900}
#stageText,#growText{font-size:12px;color:var(--muted)}#growText{color:#ffd0dc}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 0 0 2px var(--hi);padding:6px 9px 8px}
.sh{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;margin-bottom:4px}
.sh .v{margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:12px;background:#0a1020;border:2px solid #0a1020}
.bar i{display:block;height:100%;transition:width .4s steps(6);box-shadow:inset 0 3px 0 #ffffff55}
.stat.low{animation:low 1s steps(2) infinite}
@keyframes low{50%{box-shadow:inset 0 0 0 2px #ff5a6a}}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{appearance:none;-webkit-appearance:none;border:3px solid var(--line);background:#e8c98c;color:#3a2a2a;border-radius:0;
 box-shadow:inset 0 -5px 0 #b88a52,inset 0 3px 0 #fff3c0;padding:8px 2px 11px;font-size:14px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:70px}
.act:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #b88a52,inset 0 3px 0 #fff3c0}
.act:disabled{filter:grayscale(.85) brightness(.7)}
.act.on{background:#a9c6f0;box-shadow:inset 0 -5px 0 #5f82b8,inset 0 3px 0 #e4efff}
canvas.picon{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 0 0 2px var(--hi);padding:9px 11px;font-size:13px}
.xph{display:flex;justify-content:space-between;font-weight:700}
.xpbar{height:10px;background:#0a1020;margin-top:6px}
.xpbar i{display:block;height:100%;background:var(--gold);transition:width .4s;box-shadow:inset 0 3px 0 #fff6}
#log{margin:7px 0 0;color:#d8e5f8;min-height:1.4em}
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.toolbar.three{grid-template-columns:repeat(3,1fr)}.tool.big{background:#5a3f78;box-shadow:inset 0 0 0 2px #8a6ab0;font-size:14px;padding:11px 2px}
#battle{position:fixed;inset:0;z-index:15;background:#0e1528;overflow:auto;-webkit-overflow-scrolling:touch}
#battle .in{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:8px}

#blog{white-space:pre-line;min-height:2.8em;background:#fff9e8;color:#273753;border:3px solid #273753;padding:7px 10px;font-weight:700;font-size:14px;line-height:1.4}
.stagebtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-top:6px}
.eggrow{display:flex;gap:10px;align-items:center;background:#14203a;border:2px solid var(--line);padding:6px;margin-top:6px}.eggrow canvas{width:72px;height:72px;image-rendering:pixelated}
.prog{height:9px;background:#0a1020;margin:4px 0 8px}.prog i{display:block;height:100%;background:#7ccc5a}
ol.howto{padding-left:22px;margin:6px 0}ol.howto li{margin:4px 0}code{background:#0a1020;padding:1px 5px;word-break:break-all;font-size:12px}
.tool{background:#2b4264;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #50698f;padding:9px 2px;font-size:13px;font-weight:700;min-height:46px}
.tool:active{background:#22375a}

/* modal */
#modal{position:fixed;inset:0;background:#050a18cc;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#1d2c4a;border-top:4px solid #5a76a8;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);font-size:14px;line-height:1.6}
.sheet h2{margin:0 0 10px;font-size:18px}
.sheet p{margin:6px 0}
.sheet ul{margin:6px 0;padding-left:20px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{flex:1 1 auto;min-width:96px;background:#3a5580;border:2px solid var(--line);box-shadow:inset 0 -3px 0 #233a5e;padding:11px 10px;font-weight:800}
.btn.pri{background:#e8c98c;color:#3a2a2a;box-shadow:inset 0 -3px 0 #b88a52}
.btn.danger{background:#a8394c;box-shadow:inset 0 -3px 0 #6e1f30}
.sheet input[type=text],.sheet textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:2px solid var(--line);background:#fff9e8;color:#273753;border-radius:0}
.sheet textarea{height:84px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.err{color:#ff9aa8;min-height:1.2em;font-size:13px}
.codex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#14203a;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #3f5a88;padding:8px;text-align:center;font-size:12.5px;line-height:1.4}
.card canvas{width:96px;height:96px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.card b{font-size:14px}
.lean{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12.5px;margin-top:8px}
.lean .b{height:9px;background:#0a1020}.lean .b i{display:block;height:100%}
.sprites{overflow-x:auto;background:#7fb07a;padding:6px;border:2px solid var(--line)}
.sprites canvas{display:block;height:96px;image-rendering:pixelated;margin-bottom:4px}
.small{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:#fff3d5;color:#273753;border:3px solid #273753;box-shadow:3px 3px 0 #0008;padding:8px 14px;font-size:14px;font-weight:700;z-index:30;max-width:90%;text-align:center;transition:opacity .3s}
#toast.off{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body.rm *{transition:none!important;animation:none!important}
</style>

<div id="app">
 <header>
  <div><h1>幻獸日記</h1><div class="ver">PIXEL FAMILIAR · V<span id="ver"></span></div></div>

</div></div>

<script src="game-core.js"></script>
<script>
'use strict';
/* =========================================================
   幻獸日記 Pixel Familiar — V1.3
   單一檔案：遊戲邏輯 + 程式化 16-bit 像素 sprite sheet 產生器
   ========================================================= */
const VERSION='1.6.0';
const SAVE_KEY='pixel-familiar-save',BACKUP_KEY='pixel-familiar-save-backup',LEGACY_KEY='pixel-familiar-v1',TIP_KEY='pixel-familiar-tip-closed';
const W=128,H=112,CELL=48,PET_X=40,PET_Y=56;           // 場景邏輯解析度與角色格位置
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));
const num=(v,d,a,b)=>{v=Number(v);return Number.isFinite(v)?clamp(v,a,b):d};
const chars=t=>Array.from(String(t));
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- 安全儲存（失敗時退回記憶體，不讓遊戲當掉） ---------------- */
const store={ok:true,mem:{},
 get(k){try{return localStorage.getItem(k)}catch(e){this.ok=false;return k in this.mem?this.mem[k]:null}},
 set(k,v){try{localStorage.setItem(k,v);return true}catch(e){this.ok=false;this.mem[k]=v;return false}},
 del(k){try{localStorage.removeItem(k)}catch(e){}delete this.mem[k]}};

/* ---------------- 規則核心（game-core.js，可單獨做單元測試） ---------------- */
const PC=window.PFCore;
const {CONFIG,ROUTES,makeGenome,CLASSIC_G,encodeGenome,decodeGenome,G_SIDE,gidOf,genomeFromId,formCode,fresh,sanitize}=PC;
const FORMS={egg:{name:'神秘的蛋',stage:0}};
const STAGE_NAME={egg:'蛋',juvenile:'幼年期',adolescent:'少年期',adult:'成年期',ascended:'高階'};
const ROUTE_ICON={flame:'🔥',tide:'💧',forest:'🌿'},ROUTE_LABEL={flame:'焰系',tide:'潮系',forest:'森系'};
const BOND_UNLOCK={20:'解鎖：撒嬌表情與早安問候',50:'解鎖：每天的小禮物',80:'解鎖：心之羈絆（戰鬥中撐住一次）'};

/* ---------------- 物種外觀（由基因產生） ---------------- */
function hsl(h,s,l){h=((h%360)+360)%360;s=clamp(s)/100;l=clamp(l)/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
 return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
const HUE_NAMES=[[15,'緋','Scarlet'],[40,'焰','Blaze'],[65,'琥','Amber'],[95,'苔','Moss'],[150,'翠','Jade'],[185,'湖','Lagoon'],[215,'霜','Frost'],[250,'夜','Night'],[285,'紫','Violet'],[320,'霞','Dusk'],[345,'桃','Peach'],[361,'緋','Scarlet']];
const SIDE_NAMES={nubs:['角','Nub'],horns:['角','Horn'],leaves:['葉','Leaf'],ears:['耳','Ear'],bunny:['兔','Bun'],none:['絨','Fluff']};
const ROUTE_NAMES={flame:['焰','Flame'],tide:['潮','Tide'],forest:['森','Forest']};
const CLASSIC_NAMES={juv:['露露獸','Lulu'],flame:['焰尾獸','Flametail'],tide:['潮靈獸','Tidewisp'],forest:['森語獸','Forestsong']};
const RARITY=['','普通','稀有','傳說'],STARS=['','★','★★','★★★'];
function codeRoute(code){return code.startsWith('asc-')?code.slice(4):(ROUTES.includes(code)?code:null)}
function speciesName(G,code,classic){const route=codeRoute(code),asc=code.startsWith('asc-');
 if(classic){const b=CLASSIC_NAMES[route||'juv'];return{name:(asc?'聖':'')+b[0],en:(asc?'Ascended ':'')+b[1]}}
 const hn=HUE_NAMES.find(([m])=>G.hue<m),sn=SIDE_NAMES[G.side],pre=(asc?'聖':'')+(G.rarity===3?'星':''),epre=(asc?'Ascended ':'')+(G.rarity===3?'Star ':'');
 return route?{name:pre+hn[1]+sn[0]+ROUTE_NAMES[route][0]+'獸',en:`${epre}${hn[2]} ${sn[1]} · ${ROUTE_NAMES[route][1]}`}:{name:pre+hn[1]+sn[0]+'獸',en:`${epre}${hn[2]} ${sn[1]}`}}
/* code：juv 幼年／teen 少年／flame|tide|forest 成年／asc-路線 高階 */
function genomeForm(G,code='juv',classic=false){
 const asc=code.startsWith('asc-'),route=codeRoute(code),grow=code==='juv'?0:code==='teen'?1:asc?3:2;
 const ah=route==='flame'?40:route==='tide'?195:route==='forest'?95:G.acc,gold=G.rarity===3||asc,h=G.hue,s=G.sat;
 const pal={o:hsl(h,35,13),b:hsl(h,s,56),d:hsl(h,s,38),l:hsl(h,s-5,75),feet:hsl(h,s-5,75),pat:hsl(h,s+10,42),
  belly:G.pattern==='belly'?hsl(G.acc,60,86):hsl(G.bh,45,91),bellyD:G.pattern==='belly'?hsl(G.acc,50,74):hsl(G.bh,35,79),
  horn:gold?'#ffe680':hsl(ah,70,76),hornD:gold?'#d9a441':hsl(ah,60,52),acc:gold&&!route?'#ffd34a':hsl(ah,80,68),accD:gold&&!route?'#e0902a':hsl(ah,70,48)};
 const feat=[],add=f=>{if(f&&f!=='none'&&!feat.includes(f))feat.push(f)};
 let side=G.side,top=G.top,tail=G.tail;
 if(code==='teen'&&top==='none')top='tuft';
 if(route==='flame'){if(side==='nubs'||side==='none')side='horns';if(top==='none'||top==='tuft')top='crest';tail='flame'}
 if(route==='tide'){add('fins');if(top==='none'||top==='tuft')top='antenna';tail='fin'}
 if(route==='forest'){add('wings');if(top==='none'||top==='tuft')top='flower';tail='leaf'}
 add(side);add(top);if(G.wings||asc)add('wings');
 if(G.pattern==='spots'||G.pattern==='stripes')add('pat-'+G.pattern);if(gold)add('sparkle');if(G.eyes==='big')add('bigeyes');
 const nm=speciesName(G,code,classic);
 return{name:nm.name,en:nm.en,rx:G.rx+grow,ry:G.ry+grow,feat,tail,pal,genome:G,code,classic}}

/* ---------------- 存檔（localStorage；資料檢查與遷移在 game-core.js） ---------------- */
function parse(raw){if(!raw)return null;try{const o=JSON.parse(raw);return o&&typeof o==='object'?o:null}catch(e){return null}}
function load(){
 const main=store.get(SAVE_KEY);let o=parse(main);if(o)return{s:sanitize(o),src:'main'};
 o=parse(store.get(BACKUP_KEY));if(o)return{s:sanitize(o),src:main?'backup-corrupt':'backup'};
 o=parse(store.get(LEGACY_KEY));if(o)return{s:sanitize(o),src:'legacy'};
 return{s:fresh(),src:'new'}}
let s,lastBackup=0,lastSave=0;
/* 多分頁保護：如果別的分頁（例如捷徑開啟的新分頁）已經存了更新的進度，就採用它，不用舊資料覆蓋 */
function save(){
 const cur=parse(store.get(SAVE_KEY));if(cur&&Number(cur.rev)>s.rev){s=sanitize(cur);lastSave=Date.now();renderUI();return}
 s.rev++;s.updated=Date.now();lastSave=s.updated;
 if(s.updated-lastBackup>60000){const prev=store.get(SAVE_KEY);if(prev&&parse(prev))store.set(BACKUP_KEY,prev);lastBackup=s.updated}
 const ok=store.set(SAVE_KEY,JSON.stringify(s));$('saveWarn').classList.toggle('hidden',ok)}

/* ---------------- 時間（離線模擬規則在 game-core.js） ---------------- */
let clockWarned=false;
function handleTime(r){if(!r)return;if(r.warn==='back'&&!clockWarned){clockWarned=true;toast('⚠️ 裝置時間好像倒退了，遊戲不會回溯進度',4000)}
 if(r.warn==='jump')toast('⚠️ 離開很久了：離線變化最多只計算 12 小時',4000)}
function tick(){const r=PC.applyTime(s,Date.now());handleTime(r);return r}

/* =========================================================
   像素繪圖核心：grid → 自動描邊 → ImageData
   ========================================================= */
function grid(w,h){return{w,h,a:new Array(w*h).fill(0)}}
function px(g,x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<g.w&&y<g.h)g.a[y*g.w+x]=c}
function get(g,x,y){return x>=0&&y>=0&&x<g.w&&y<g.h?g.a[y*g.w+x]:0}
function ellipse(g,cx,cy,rx,ry,fn){
 for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
  const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry;if(nx*nx+ny*ny<=1){const c=fn(x,y,nx,ny);if(c)px(g,x,y,c)}}}
function outline(g,col){const b=g.a.slice();for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){if(b[y*g.w+x])continue;
 if((x>0&&b[y*g.w+x-1])||(x<g.w-1&&b[y*g.w+x+1])||(y>0&&b[(y-1)*g.w+x])||(y<g.h-1&&b[(y+1)*g.w+x]))g.a[y*g.w+x]=col}}
const rgbCache={};
function rgb(h){if(rgbCache[h])return rgbCache[h];const n=parseInt(h.slice(1),16);return rgbCache[h]=[n>>16&255,n>>8&255,n&255]}
function blit(g,img,ox,oy=0){for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){const c=g.a[y*g.w+x];if(!c)continue;
 const i=((oy+y)*img.width+ox+x)*4,[r,gg,b]=rgb(c);img.data[i]=r;img.data[i+1]=gg;img.data[i+2]=b;img.data[i+3]=255}}
function gridCanvas(g){const cv=document.createElement('canvas');cv.width=g.w;cv.height=g.h;const ctx=cv.getContext('2d');const img=ctx.createImageData(g.w,g.h);blit(g,img,0);ctx.putImageData(img,0,0);return cv}

function drawCreature(F,fr){
 const g=grid(CELL,CELL),P=F.pal,has=k=>F.feat.includes(k);
 const sx=fr.sx||1,sy=fr.sy||1,dx=fr.dx||0,dy=Math.round((fr.dy||0)*(F.ry>12?.6:1)),eye=fr.eye||'open',mouth=fr.mouth||'smile';
 const rx=F.rx*sx,ry=F.ry*sy,ground=44+dy,cxi=24+dx,cx=cxi,cy=ground-3-ry+1,top=Math.round(cy-ry);
 const pm=(x,y,c)=>{px(g,x,y,c);px(g,2*cxi-1-x,y,c)};          // 左右鏡射
 const rect=(x,y,w,c,m)=>{for(let i=0;i<w;i++)(m?pm:(a,b,cc)=>px(g,a,b,cc))(x+i,y,c)};
 // --- 身體後方：翅膀、尾巴 ---
 if(has('wings')){const up=fr.wing?-3:0;
  for(let k=0;k<7;k++){const y=Math.round(cy-1-k+up*(k/6));const x0=Math.round(cx-rx-1-k*.9),x1=Math.round(cx-rx+4);
   for(let x=x0;x<=x1;x++)pm(x,y,x===x0?P.accD:(k%2?P.acc:P.l))}}
 const tb=[[0,0],[2,0],[4,-1],[5,-3],[5,-5],[4,-6]],wag=fr.tail?1:0;
 const tx0=Math.round(cx+rx-5),ty0=Math.round(cy+ry*.4);let tip=[0,0];
 const tcount=F.tail==='none'?1:F.tail==='fluffy'?3:tb.length;
 tb.slice(0,tcount).forEach(([ox,oy],i)=>{const sh=i>=3?wag:0,X=tx0+ox+sh,Y=ty0+oy-sh;tip=[X,Y];
  for(let a=0;a<3;a++)for(let b=0;b<3;b++)px(g,X+a,Y+b,b===2?P.d:(i===tb.length-1&&F.tail==='small'?P.acc:P.b))});
 const [tx,ty]=tip;
 if(F.tail==='fluffy')ellipse(g,tx+3,ty,4.2,4,(x,y,nx,ny)=>nx*.5+ny*.7>.5?P.d:((nx+.4)**2+(ny+.4)**2<.12?'#ffffff':P.l));
 if(F.tail==='flame'){rect(tx+1,ty-4,1,P.acc);rect(tx,ty-3,3,P.acc);rect(tx-1,ty-2,4,P.accD);rect(tx-1,ty-1,5,P.accD);px(g,tx+1,ty-2,'#fff6c8');px(g,tx+1,ty-1,P.acc);px(g,tx+2,ty-1,P.acc)}
 if(F.tail==='fin'){for(let r=0;r<5;r++)for(let x=0;x<=r+1;x++)px(g,tx+2+x,ty-3+r,x%2?P.accD:P.acc)}
 if(F.tail==='leaf'){rect(tx+2,ty-4,2,P.acc);rect(tx+1,ty-3,4,P.acc);rect(tx+1,ty-2,4,P.acc);rect(tx+2,ty-1,2,P.acc);px(g,tx+3,ty-3,P.accD);px(g,tx+2,ty-2,P.accD)}
 // --- 腳 ---
 const fy=fr.feet==='tuck'?ground-3:ground-1,fxo=Math.round(rx*.5);
 ellipse(g,cx-fxo,fy,3.2,2.2,(x,y,nx,ny)=>ny>.3?P.d:P.feet);ellipse(g,cx+fxo,fy,3.2,2.2,(x,y,nx,ny)=>ny>.3?P.d:P.feet);
 // --- 身體（光源左上） ---
 ellipse(g,cx,cy,rx,ry,(x,y,nx,ny)=>nx*.55+ny*.8>.62?P.d:((nx+.42)**2+(ny+.55)**2<.08?P.l:P.b));
 ellipse(g,cx,cy+ry*.5,rx*.56,ry*.42,(x,y,nx,ny)=>ny>.45||nx>.62?P.bellyD:P.belly);
 const onBody=(x,y)=>{const c=get(g,Math.round(x),Math.round(y));return c===P.b||c===P.d||c===P.l};
 const pp=(x,y,c)=>{if(onBody(x,y))px(g,x,y,c)};
 if(has('pat-spots'))[[-8,-3],[6,-5],[-5,-7],[8,2],[-9,3]].forEach(([ox,oy])=>{for(const[a,b]of[[0,0],[1,0],[0,1],[1,1]])pp(cxi+ox+a,Math.round(cy)+oy+b,P.pat)});
 if(has('pat-stripes'))for(let k=1;k<=4;k++){pp(cxi-1,top+k,P.pat);pp(cxi,top+k,P.pat);if(k<=3){pp(cxi-5,top+k+1,P.pat);pp(2*cxi-1-(cxi-5),top+k+1,P.pat)}pp(Math.round(cx-rx)+1,Math.round(cy)+k-2,P.pat);pp(Math.round(cx+rx)-2,Math.round(cy)+k-2,P.pat)}
 if(has('sparkle'))[[-7,-5],[6,-7],[9,1],[-9,2]].forEach(([ox,oy])=>pp(cxi+ox,Math.round(cy)+oy,'#ffffff'));
 // --- 頭部特徵 ---
 if(has('nubs')){const bx=cxi-7;[[0,-1,2],[0,-2,2],[0,-3,1]].forEach(([ox,oy,w])=>{for(let i=0;i<w;i++)pm(bx+ox+i,top+1+oy,i===w-1&&w>1?P.hornD:P.horn)})}
 if(has('horns')){const bx=cxi-9;[[0,0,3],[0,-1,3],[-1,-2,3],[-1,-3,3],[-2,-4,2],[-2,-5,2],[-3,-6,2],[-3,-7,1]].forEach(([ox,oy,w])=>{for(let i=0;i<w;i++)pm(bx+ox+i,top+1+oy,i===0?P.hornD:P.horn)})}
 if(has('crest')){rect(cxi-2,top,4,P.accD);rect(cxi-2,top-1,4,P.acc);rect(cxi-1,top-2,2,P.acc);px(g,cxi-1,top-3,P.acc);px(g,cxi,top-1,'#fff6c8')}
 if(has('fins')){const lx=Math.round(cx-rx),y0=Math.round(cy-ry*.35);
  [[-6,-3,2],[-6,-2,4],[-5,-1,5],[-4,0,5],[-2,1,3]].forEach(([ox,oy,w])=>{for(let i=0;i<w;i++)pm(lx+ox+i,y0+oy,(lx+ox+i)%2?P.accD:P.acc)})}
 if(has('antenna')){for(let k=1;k<=4;k++)px(g,cxi,top-k+1,P.d);rect(cxi-1,top-5,3,P.acc);rect(cxi-1,top-4,3,P.acc);px(g,cxi-1,top-5,'#ffffff')}
 if(has('leaves')){const bx=cxi-8;[[0,0,3],[-1,-1,4],[-2,-2,4],[-3,-3,4],[-3,-4,3],[-4,-5,2],[-4,-6,1]].forEach(([ox,oy,w],i)=>{for(let k=0;k<w;k++)pm(bx+ox+k,top+1+oy,k===1&&i>0&&i<6?P.accD:P.acc)})}
 if(has('ears')){const bx=cxi-10;[[0,0,5],[0,-1,4],[1,-2,3],[1,-3,2],[2,-4,1]].forEach(([ox,oy,w],i)=>{for(let k=0;k<w;k++)pm(bx+ox+k,top+2+oy,k>0&&k<w-1&&i<3?P.acc:(k===0?P.d:P.b))})}
 if(has('bunny')){for(let k=0;k<9;k++){const x=cxi-8-Math.floor(k/4);for(let w=0;w<3;w++)pm(x+w,top+1-k,w===1&&k>0&&k<8?P.acc:(w===0?P.d:P.b))}}
 if(has('tuft')){rect(cxi-1,top,2,P.l);rect(cxi-1,top-1,2,P.l);px(g,cxi-2,top-2,P.l);px(g,cxi+1,top-2,P.l);px(g,cxi,top-3,P.l);px(g,cxi-1,top-1,P.b)}
 if(has('flower')){rect(cxi-2,top,4,P.horn);rect(cxi-1,top-1,2,P.horn);rect(cxi-1,top+1,2,P.horn);px(g,cxi-1,top,'#ffe066');px(g,cxi,top,'#ffe066')}
 // --- 臉 ---
 const ex=Math.round(rx*.4),ey=Math.round(cy-ry*.12),L=cxi-ex-3,E=P.o,Wt='#ffffff';
 const eyeAt=(x,side)=>{
  if(eye==='open'&&has('bigeyes')){for(let yy=-3;yy<=1;yy++)rect(x,ey+yy,3,E);px(g,x,ey-3,Wt);px(g,x,ey-2,Wt);px(g,x+1,ey-3,Wt);px(g,x+2,ey+1,Wt)}
  else if(eye==='open'){for(let yy=-2;yy<=1;yy++)rect(x,ey+yy,3,E);px(g,x,ey-2,Wt);px(g,x,ey-1,Wt)}
  else if(eye==='blink'){rect(x,ey,3,E)}
  else if(eye==='happy'){px(g,x,ey,E);px(g,x+1,ey-1,E);px(g,x+2,ey,E)}
  else if(eye==='sleep'){px(g,x,ey,E);px(g,x+1,ey+1,E);px(g,x+2,ey,E)}
  else if(eye==='squint'){if(side<0){px(g,x,ey-1,E);px(g,x+1,ey,E);px(g,x,ey+1,E);px(g,x+2,ey,E)}else{px(g,x+2,ey-1,E);px(g,x+1,ey,E);px(g,x+2,ey+1,E);px(g,x,ey,E)}}
  else if(eye==='sad'){for(let yy=-1;yy<=1;yy++)rect(x,ey+yy,3,E);px(g,x,ey-1,Wt);
   if(side<0){px(g,x,ey-3,E);px(g,x+1,ey-3,E);px(g,x+2,ey-4,E)}else{px(g,x,ey-4,E);px(g,x+1,ey-3,E);px(g,x+2,ey-3,E)}}
  else if(eye==='tired'){rect(x,ey-1,3,P.d);rect(x,ey,3,E);rect(x,ey+1,3,E);px(g,x,ey,Wt)}};
 eyeAt(L,-1);eyeAt(2*cxi-1-L-2,1);
 if(fr.blush||eye==='open'||eye==='happy'){const ch=fr.blush===2?'#ff6a8a':'#f59ab0';rect(L-1,ey+2,2,ch,1);if(fr.blush)rect(L-1,ey+3,2,ch,1)}
 const my=ey+3,M='#6a2433';
 if(mouth==='smile'){px(g,cxi-3,my,M);px(g,cxi-2,my+1,M);px(g,cxi-1,my,M);px(g,cxi,my,M);px(g,cxi+1,my+1,M);px(g,cxi+2,my,M)}
 else if(mouth==='open'){rect(cxi-2,my,4,M);rect(cxi-2,my+1,4,M);rect(cxi-1,my+2,2,'#f07a8a')}
 else if(mouth==='o'){rect(cxi-1,my,2,M);rect(cxi-1,my+1,2,M)}
 else if(mouth==='chew'){rect(cxi-2,my+1,4,M)}
 else if(mouth==='flat'){rect(cxi-1,my+1,2,M)}
 outline(g,P.o);return g}

const EGG_FRAMES=[];for(let c=0;c<4;c++)for(const l of['L','0','R'])EGG_FRAMES.push('egg'+c+l);
function drawEgg(name,C){
 const c=+name[3],lean=name[4],k=lean==='L'?-.11:lean==='R'?.11:0,g=grid(CELL,CELL),cx=24,cy=31,rx=10,ry=13;
 const spots=new Set(['19,23','20,23','19,24','20,24','28,29','29,29','28,30','29,30','30,30','21,35','22,35','26,20','27,20','16,30']);
 for(let y=cy-ry-1;y<=cy+ry+1;y++){const off=(44-y)*k;for(let x=8;x<40;x++){
  const xx=x-off,ny=(y+.5-cy)/ry,rxe=rx*(1-.16*Math.max(0,-ny)),nx=(xx+.5-cx)/rxe;if(nx*nx+ny*ny>1)continue;
  let col=nx*.5+ny*.7>.55?C.shellD:((nx+.45)**2+(ny+.5)**2<.06?'#ffffff':C.shell);
  if(spots.has(Math.round(xx)+','+y))col=nx*.5+ny*.7>.5?C.spotD:C.spot;px(g,x,y,col)}}
 const crack=(pts)=>pts.forEach(([x,y])=>{const off=(44-y)*k;const X=Math.round(x+off);if(get(g,X,y))px(g,X,y,'#5a3a2a')});
 if(c>=1)crack([[17,28],[18,27],[19,28],[20,29],[21,28],[22,27],[23,28],[24,29]]);
 if(c>=2)crack([[25,28],[26,27],[27,28],[28,29],[29,28],[30,27],[31,28],[24,27],[24,26],[25,25]]);
 if(c>=3){crack([[20,26],[21,25],[22,24],[27,26],[28,25]]);for(let y=26;y<=28;y++)for(let x=22;x<=27;x++){const off=(44-y)*k;if(get(g,Math.round(x+off),y))px(g,x+off,y,'#20304e')}
  const off=(44-27)*k;px(g,23+off,27,C.hole);px(g,26+off,27,C.hole)}

function petKey(id,code){return`${id}|${code||'juv'}`}
function eggKey(id){return id==='classic'?'egg':'egg|'+id}
function formOf(key){if(FORMS[key])return FORMS[key];if(FCACHE[key])return FCACHE[key];
 if(key.startsWith('egg|')){const G=genomeFromId(key.slice(4));return FCACHE[key]={name:G.rarity===3?'閃著金光的蛋':G.rarity===2?'有點特別的蛋':'神秘的蛋',stage:0,genome:G}}

function eggColors(key){if(!key.startsWith('egg|'))return{shell:'#fff1d0',shellD:'#e5c08c',spot:'#5cc2b0',spotD:'#3a8c8a',hole:'#5cc2b0'};
 const G=genomeFromId(key.slice(4));if(G.rarity===3)return{shell:'#fff3c0',shellD:'#e8c070',spot:'#ffd34a',spotD:'#e0902a',hole:hsl(G.hue,G.sat,56)};
 const P=genomeForm(G,'juv').pal;return{shell:hsl(G.hue,30,94),shellD:hsl(G.hue,28,80),spot:P.b,spotD:P.d,hole:P.b}}

function buildSheet(key){

 const ctx=cv.getContext('2d'),img=ctx.createImageData(cv.width,CELL);
 names.forEach((n,i)=>blit(isEgg?drawEgg(n,EC):drawCreature(F,FRAMES[n]),img,i*CELL));ctx.putImageData(img,0,0);
 const sil=document.createElement('canvas');sil.width=cv.width;sil.height=CELL;const sc=sil.getContext('2d');
 sc.drawImage(cv,0,0);sc.globalCompositeOperation='source-in';sc.fillStyle='#ffffff';sc.fillRect(0,0,sil.width,CELL);
 const dark=document.createElement('canvas');dark.width=cv.width;dark.height=CELL;const dc=dark.getContext('2d');
 dc.drawImage(cv,0,0);dc.globalCompositeOperation='source-in';dc.fillStyle='#0b1324';dc.fillRect(0,0,dark.width,CELL);
 return SHEETS[key]={cv,sil,dark,names,idx:Object.fromEntries(names.map((n,i)=>[n,i]))}}

const STATS=[['hunger','飽食','apple','#f19a6a'],['mood','心情','heart','#f18fae'],['clean','清潔','drop','#73c9e6'],['energy','體力','bolt','#f2cc6e']];
function buildStats(){$('stats').innerHTML=STATS.map(([k,l,ic,c])=>`<div class="stat" id="st-${k}"><div class="sh"><canvas class="picon" data-icon="${ic}" data-s="2"></canvas>${l}<span class="v" id="sv-${k}"></span></div><div class="bar"><i id="sb-${k}" style="background:${c}"></i></div></div>`).join('')}
function dayCount(){return Math.floor((Date.now()-s.hatchedAt)/86400000)+1}
function growLine(){
 if(!s.hatched)return'';const now=Date.now(),q=PC.stageReq(s,now),hint=PC.tendencyHint(s);let g=`💗 親密度 ${Math.round(s.bond)}`;
 if(q){const left=[];if(!q.ageOk)left.push(`${Math.ceil(q.hours-q.age)} 小時`);if(!q.xpOk)left.push(`${q.xp-s.xp} XP`);if(!q.eventOk)left.push(`「${PC.EVENT_TEXT[PC.ROUTE_EVENT[s.route]]}」事件`);
  g+=left.length?` · 距離${STAGE_NAME[q.next]}：${left.join('、')}`:` · 即將長成${STAGE_NAME[q.next]}！`}
 return g+(hint?` · ${hint}`:'')}
function renderUI(){
 $('coins').textContent=s.coins;
 const F=formOf(formKey()),rar=F.genome&&F.genome.rarity>1&&!F.classic?` · ${STARS[F.genome.rarity]}${RARITY[F.genome.rarity]}`:'',tierN=PC.stepTier(s);
 $('petname').textContent=s.hatched?`${s.name}　Lv.${lvl()}${tierN?' '+'✦'.repeat(Math.min(5,tierN)):''}`:F.name;
 $('stageText').textContent=!s.hatched?`輕點蛋 5 下來孵化（${s.eggTaps}/5）${F.genome?' · 會孵出什麼新物種呢？':''}`:`${STAGE_NAME[s.stage]} · ${F.name}${rar} · 第 ${dayCount()} 天`;
 $('growText').textContent=growLine();
 $('stepInfo').textContent=`🍎 食物 ${s.inv.food} · 🌱 種子 ${s.inv.seeds} · 👟 今日 ${fmtN(s.steps.days[PC.dayKey(Date.now())]||0)} 步 · ⚔️ 今日冒險 ${s.daily.adv}${s.eggs.length?' · 🧺 蛋 '+s.eggs.length:''}`;
 for(const[k]of STATS){const v=s.hatched?s[k]:0;$('sv-'+k).textContent=s.hatched?Math.round(v)+'%':'--';$('sb-'+k).style.width=v+'%';$('st-'+k).classList.toggle('low',s.hatched&&v<20)}
 document.querySelectorAll('[data-act]').forEach(b=>b.disabled=!s.hatched);
 $('sleepLabel').textContent=s.sleeping?'叫醒':'睡覺';$('sleepBtn').classList.toggle('on',s.sleeping);
 const want=s.sleeping?'sun':'moon';if($('sleepIcon').dataset.icon!==want){$('sleepIcon').dataset.icon=want;paintIcon($('sleepIcon'),want)}
 const q=s.hatched&&PC.stageReq(s,Date.now()),goal=q?q.xp:0;
 $('xptext').textContent=!s.hatched?'—':q?`${s.xp} / ${goal} XP（${STAGE_NAME[q.next]}）`:`${s.xp} XP`;$('xpbar').style.width=(!s.hatched?0:q?Math.min(100,s.xp/goal*100):100)+'%';
 document.body.classList.toggle('rm',rm())}

/* ---------------- 存檔匯出／匯入 ---------------- */
function checksum(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h.toString(36)}
function exportCode(){const b64=btoa(unescape(encodeURIComponent(JSON.stringify({app:'pixel-familiar',ver:VERSION,at:Date.now(),save:s}))));return'PF1.'+b64+'.'+checksum(b64)}
function decodeCode(code){code=String(code||'').replace(/\s+/g,'');
 if(code.startsWith('{')){const o=parse(code);return o&&(o.save||o)}
 const m=/^PF1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/.exec(code);if(!m)throw new Error('格式不正確');if(checksum(m[1])!==m[2])throw new Error('存檔碼不完整或被修改過');
 const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o||o.app!=='pixel-familiar'||!o.save)throw new Error('這不是幻獸日記的存檔');return o.save}
function fmtTime(t){if(!t)return'從未';const d=new Date(t);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

<div class="err" id="impErr"></div>`);
 if(inFrame)$('bFile').classList.add('hidden');
 $('bCopy').onclick=async()=>{const code=exportCode();let ok=false;try{await navigator.clipboard.writeText(code);ok=true}catch(e){}
  if(!ok){const ta=$('impText');ta.value=code;ta.focus();ta.select();try{ok=document.execCommand('copy')}catch(e){}}
  s.lastExport=Date.now();save();toast(ok?'✅ 已複製存檔碼，請貼到備忘錄保存':'已把存檔碼放進下方文字框，請長按全選後複製')};
 $('bFile').onclick=async()=>{const code=exportCode(),name=`pixel-familiar-${new Date().toISOString().slice(0,10)}.txt`;s.lastExport=Date.now();save();
  try{const f=new File([code],name,{type:'text/plain'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'幻獸日記存檔'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('已下載存檔檔案')};
 const doImport=(text)=>{try{const o=sanitize(decodeCode(text));
   confirmBox('確定匯入？',`將以「${esc(o.hatched?o.name+' Lv.'+o.level:'未孵化的蛋')}」取代目前進度。目前進度會先保留為備份。`,'匯入',()=>{store.set(BACKUP_KEY,JSON.stringify(s));o.rev=s.rev;s=o;s.lastTick=Math.min(s.lastTick,Date.now());lastBackup=Date.now();save();tick();renderUI();evo=null;toast('✅ 匯入成功！');say(s.hatched?`${s.name}回來了！`:'蛋回來了！')})
  }catch(e){$('impErr').textContent='❌ 匯入失敗：'+(e.message||'無法讀取')}};
 $('bImp').onclick=()=>doImport($('impText').value);
 $('impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f)}}

window.addEventListener('pagehide',()=>{tick();save()});
window.addEventListener('storage',e=>{if(e.key===SAVE_KEY&&e.newValue){const o=parse(e.newValue);if(o&&Number(o.rev)>s.rev){s=sanitize(o);renderUI()}}});

/* ---------------- 輸入 ---------------- */
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 if(x>=PET_X-2&&x<=PET_X+CELL+2&&y>=PET_Y-6&&y<=PET_Y+CELL+2)tapPet();else{unlockAudio();spawn('spark',1,{x,y,vy:-6,jx:0,jy:0,life:.5,spread:0})}});
cv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapPet()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));
$('bAdv').onclick=advDialog;$('bSteps').onclick=stepsDialog;$('bMate').onclick=mateDialog;
$('bRename').onclick=()=>renameDialog(false);$('bCodex').onclick=codexDialog;$('bSave').onclick=saveDialog;$('bMenu').onclick=menuDialog;
$('homeTipX').onclick=()=>{$('homeTip').classList.add('hidden');store.set(TIP_KEY,'1')};

/* ---------------- 啟動 ---------------- */
function init(){
 $('ver').textContent=VERSION;
 buildIcons();cloudCv=gridCanvas(CLOUD);
 buildStats();document.querySelectorAll('canvas.picon').forEach(c=>paintIcon(c,c.dataset.icon));
 const raw=parse(store.get(SAVE_KEY)),upgraded=!!(raw&&!(Number(raw.v)>=6));
 const L=load();s=L.s;
 if(L.src==='new'&&window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)s.settings.reducedMotion=true;
 tick();
 let urlMsg='';try{const q=new URLSearchParams(location.search);if(q.has('steps')){urlMsg=stepResultMsg(creditSteps(q.get('steps'),q.get('d')));history.replaceState(null,'',location.pathname+location.hash)}}catch(e){}
 save();renderUI();startLoop();setTimeout(runStages,1500);dailyCheck();
 if(upgraded)setTimeout(()=>toast('✅ 存檔已升級到 V1.6 新規則（等級改為累積經驗、加入成長階段）',4500),2600);
 if(urlMsg)setTimeout(()=>{toast(urlMsg,5000);spawn('shoe',3,{y:70,life:1.2,stagger:.2})},300);
 if(L.src==='legacy')toast('✅ 已自動搬移 V1.x 舊存檔');
 else if(L.src==='backup-corrupt')toast('⚠️ 主存檔損壞，已從備份還原');
 if(!store.ok)$('saveWarn').classList.remove('hidden');
 if(inFrame){const tp=$('homeTip');tp.innerHTML='🧪 這是 Claude 內的<b>快速試玩版</b>。存檔只留在這個頁面，可能被清除；正式遊玩請用 GitHub Pages 網址，並用「存檔」搬移進度。<button id="homeTipX" aria-label="關閉">✕</button>';tp.classList.remove('hidden');$('homeTipX').onclick=()=>tp.classList.add('hidden')}
 else if(isIOS&&!standalone()&&!store.get(TIP_KEY))$('homeTip').classList.remove('hidden');
 setTimeout(()=>say(s.hatched?(s.sleeping?'Zzz…':`${s.name}：歡迎回來！`):'輕點蛋看看？',{log:false}),400);
 let secs=0;setInterval(()=>{if(document.hidden)return;tick();renderUI();if(Date.now()-lastSave>15000)save();if(++secs%5===0&&!evo&&!B)runStages();
  if(Date.now()>nextChat&&!msgTimer&&$('modal').classList.contains('hidden'))say(chatter(),{log:false})},1000);
 if(!inFrame&&'serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!/claude|anthropic/.test(location.hostname))
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
}
window.PF={get state(){return s},PC,creditSteps,mateCode,decodeMate,encodeGenome,decodeGenome,startBattle,onMove,get B(){return B},SHEETS,sheet,formOf,makeGenome,genomeForm,petKey,FORMS,FRAMES,ICV,exportCode,decodeCode,sanitize,VERSION,
 debug:{info(){return{busy:busyUntil-Date.now(),evo:!!evo,modal:!$('modal').classList.contains('hidden'),taps:s.eggTaps,h:s.hatched,battle:!!B}},skip(min){s.lastTick-=min*60000;tick();renderUI();save()},age(h){s.hatchedAt-=h*3600000;save();runStages();renderUI()},xp(n){const x0=s.xp;PC.addXP(s,n);save();renderUI();afterChange(x0)},set(o){Object.assign(s,o);renderUI();save()}}};
try{init()}catch(e){document.body.insertAdjacentHTML('afterbegin',`<div style="padding:12px;background:#a8394c;color:#fff">啟動錯誤：${esc(e.message)}</div>`);throw e}
</script>
</body>
