'use strict';
/* =========================================================
   幻獸日記 Pixel Familiar — V1.3
   單一檔案：遊戲邏輯 + 程式化 16-bit 像素 sprite sheet 產生器
   ========================================================= */
const VERSION='1.59.0';
const SAVE_KEY='pixel-familiar-save',BACKUP_KEY='pixel-familiar-save-backup',LEGACY_KEY='pixel-familiar-v1',TIP_KEY='pixel-familiar-tip-closed';
const W=128,H=112,CELL=48,PET_X=40,PET_Y=56;           // 場景邏輯解析度與角色格位置
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));
const num=(v,d,a,b)=>{v=Number(v);return Number.isFinite(v)?clamp(v,a,b):d};
const chars=t=>Array.from(String(t));
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- 安全儲存（失敗時退回記憶體，不讓遊戲當掉） ---------------- */
const store={ok:true,mem:{},
 get(k){try{return localStorage.getItem(k)}catch(e){this.ok=false;return k in this.mem?this.mem[k]:null}},
 set(k,v){try{localStorage.setItem(k,v);return true}catch(e){this.ok=false;this.mem[k]=v;return false}},
 del(k){try{localStorage.removeItem(k)}catch(e){}delete this.mem[k]}};

/* ---------------- 規則核心（game-core.js，可單獨做單元測試） ---------------- */
const PC=window.PFCore;if(window.PF_NO_TRAITS)PC.CONFIG.traitsOn=false;   // 測試用：關掉屬性特性，數值才固定
const {CONFIG,ROUTES,makeGenome,CLASSIC_G,encodeGenome,decodeGenome,G_SIDE,gidOf,genomeFromId,formCode,fresh,sanitize}=PC;
const FORMS={egg:{name:'神秘的蛋',stage:0}};
const STAGE_NAME={egg:'蛋',baby:'嬰兒期',juvenile:'幼年期',adolescent:'少年期',adult:'成年期',ascended:'高階'};
const ROUTE_ICON={flame:'🔥',tide:'💧',forest:'🌿',earth:'🪨',bird:'🐦',elec:'⚡',metal:'⚙️'},ROUTE_LABEL={flame:'焰系',tide:'潮系',forest:'森系',earth:'土系',bird:'鳥系',elec:'電系',metal:'金系'};
const BOND_UNLOCK={20:'解鎖：撒嬌表情與早安問候',50:'解鎖：每天的小禮物',80:'解鎖：心之羈絆（戰鬥中撐住一次）'};

/* ---------------- 物種外觀（由基因產生） ---------------- */
function hsl(h,s,l){h=((h%360)+360)%360;s=clamp(s)/100;l=clamp(l)/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
 return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
const HUE_NAMES=[[15,'緋','Scarlet'],[40,'焰','Blaze'],[65,'琥','Amber'],[95,'苔','Moss'],[150,'翠','Jade'],[185,'湖','Lagoon'],[215,'霜','Frost'],[250,'夜','Night'],[285,'紫','Violet'],[320,'霞','Dusk'],[345,'桃','Peach'],[361,'緋','Scarlet']];
const SIDE_NAMES={nubs:['角','Nub'],horns:['角','Horn'],leaves:['葉','Leaf'],ears:['耳','Ear'],bunny:['兔','Bun'],none:['絨','Fluff']};
const ROUTE_NAMES={flame:['焰','Flame'],tide:['潮','Tide'],forest:['森','Forest'],earth:['岩','Terra'],bird:['翼','Sky'],elec:['雷','Volt'],metal:['鋼','Steel']};
const CLASSIC_NAMES={juv:['露露獸','Lulu'],flame:['焰尾獸','Flametail'],tide:['潮靈獸','Tidewisp'],forest:['森語獸','Forestsong'],earth:['岩甲獸','Rockshell'],bird:['風翼獸','Windwing'],elec:['雷光獸','Sparkling'],metal:['鋼鎧獸','Steelguard']};
const RARITY=['','普通','稀有','傳說'],STARS=['','★','★★','★★★'];
const EL_HUE={flame:[10,72],tide:[205,62],forest:[112,50],earth:[28,42,48],bird:[198,48,66],elec:[48,85,58],metal:[215,14,62]};   // 屬性的基本色相、飽和度、（亮度）
const EGG_EL={flame:'火焰',tide:'流水',forest:'森林',earth:'大地',bird:'天空',elec:'雷電',metal:'鋼鐵'};
/* 外觀代碼：juv[-屬性] 幼年／teen[-屬性] 少年／屬性 成年／asc-屬性 高階 */
function parseCode(code){const[a,b]=String(code).split('-');if(a==='baby')return{lv:-1,route:b||null};if(a==='juv')return{lv:0,route:b||null};if(a==='teen')return{lv:1,route:b||null};if(a==='asc')return{lv:3,route:b||null};return{lv:2,route:ROUTES.includes(a)?a:null}}
function codeRoute(code){return parseCode(code).route}
function speciesName(G,code,classic){const{lv,route}=parseCode(code),asc=lv===3,full=lv>=2&&route;
 if(classic){const b=CLASSIC_NAMES[full?route:'juv'];return{name:(asc?'聖':'')+b[0],en:(asc?'Ascended ':'')+b[1]}}
 const hn=HUE_NAMES.find(([m])=>G.hue<m),sn=SIDE_NAMES[G.side],pre=(asc?'聖':'')+(G.rarity===3?'星':''),epre=(asc?'Ascended ':'')+(G.rarity===3?'Star ':'');

/* 自己養的幻獸：名字跟著屬性和手繪造型（狐、螈、鹿…），不會出現「水系卻叫焰○獸」 */
const SPECIES={flame:['焰狐','Ember Fox'],tide:['潮螈','Tide Axolotl'],forest:['森鹿','Grove Fawn'],bird:['翼雀','Sky Finch'],earth:['岩角','Rockhorn'],metal:['鋼鱗','Steelscale'],elec:['雷猴','Volt Monkey']};
function petSpecies(F){const G=F.genome||{},r=F.route||G.el,b=SPECIES[r];if(!b||F.classic)return;const lv=parseCode(F.code).lv,star=G.rarity===3?'星':'',es=G.rarity===3?'Star ':'';

/* 同一個屬性一路長大：幼年＝屬性配色＋尾巴，少年＋頭冠，成年＋完整部位，高階＋翅膀與光芒 */
function genomeForm(G,code='juv',classic=false){
 const{lv:lv0,route}=parseCode(code),lv=Math.max(0,lv0),asc=lv===3,grow=lv;
 const EH=EL_HUE[route];   // 身體顏色跟著屬性：每隻還是有些微差異
 const h=EH?(EH[0]+((G.hue*7)%36)-18+360)%360:G.hue,s=EH?clamp(EH[1]+(G.sat-60)/3,8,95):G.sat;
 const ah=route==='flame'?40:route==='tide'?195:route==='forest'?95:route==='earth'?30:route==='bird'?205:route==='elec'?52:route==='metal'?210:G.acc,gold=G.rarity===3||asc;
 const RA={earth:['#b8946a','#7a5a3a','#c8b8a0','#8a7a68'],bird:['#f4faff','#9ac4e8','#ffffff','#b0c8e0'],elec:['#ffe040','#e09a00','#fff3a0','#d8a020'],metal:['#d8e0e8','#8a98a8','#eef2f6','#a0aab8']}[route];
 const pal={o:hsl(h,35,13),b:hsl(h,s,56),d:hsl(h,s,38),l:hsl(h,s-5,75),feet:hsl(h,s-5,75),pat:hsl(h,s+10,42),

 if(EH&&EH[2]){pal.b=hsl(h,s,EH[2]);pal.d=hsl(h,s,EH[2]-18);pal.l=hsl(h,s,EH[2]+18);pal.feet=pal.l}

 const M={flame:{tail:'flame',top:'crest'},tide:{tail:'fin',top:'antenna'},forest:{tail:'leaf',top:'flower'},earth:{tail:'club',top:'rockcrest'},bird:{tail:'feather',top:'plume'},elec:{tail:'bolt',top:'zap'},metal:{tail:'blade',top:'helm'}}[route];
 if(M){tail=M.tail;                                                   // 幼年期：屬性尾巴
  if(lv>=1){if(M.top==='helm')add('helm');else if(['flame','tide','forest'].includes(route)?(top==='none'||top==='tuft'):true)top=M.top}   // 少年期：頭冠
  if(lv>=2){                                                          // 成年期：完整部位

 add(side);add(top);if(G.wings||asc)add('wings');
 if(G.pattern==='spots'||G.pattern==='stripes')add('pat-'+G.pattern);if(gold)add('sparkle');if(G.eyes==='big')add('bigeyes');

/* ---------------- 存檔（localStorage；資料檢查與遷移在 game-core.js） ---------------- */
function parse(raw){if(!raw)return null;try{const o=JSON.parse(raw);return o&&typeof o==='object'?o:null}catch(e){return null}}
function load(){
 const main=store.get(SAVE_KEY);let o=parse(main);if(o)return{s:sanitize(o),src:'main'};
 o=parse(store.get(BACKUP_KEY));if(o)return{s:sanitize(o),src:main?'backup-corrupt':'backup'};
 o=parse(store.get(LEGACY_KEY));if(o)return{s:sanitize(o),src:'legacy'};
 return{s:fresh(),src:'new'}}
let s,lastBackup=0,lastSave=0;
/* 多分頁保護：如果別的分頁（例如捷徑開啟的新分頁）已經存了更新的進度，就採用它，不用舊資料覆蓋 */
function save(){
 const cur=parse(store.get(SAVE_KEY));if(cur&&Number(cur.rev)>s.rev){s=sanitize(cur);lastSave=Date.now();renderUI();return}
 s.rev++;s.updated=Date.now();lastSave=s.updated;
 if(s.updated-lastBackup>60000){const prev=store.get(SAVE_KEY);if(prev&&parse(prev))store.set(BACKUP_KEY,prev);lastBackup=s.updated}
 const ok=store.set(SAVE_KEY,JSON.stringify(s));$('saveWarn').classList.toggle('hidden',ok)}

/* ---------------- 時間（離線模擬規則在 game-core.js） ---------------- */
let clockWarned=false;
function handleTime(r){if(!r)return;
 if(r.events&&r.events.length&&s.hatched){if(r.events.includes('toilet'))setTimeout(()=>toast('🚽 牠自己去上廁所了，好乖！',3000),200);
  if(r.events.includes('poop')&&r.hours<.05){say('嗯嗯…💩 大便了！快點一下清掉');sfx('crack')}
  if(r.events.includes('runaway')){setTimeout(()=>{toast(`😢 ${s.name}餓太久，離家出走了…走 ${CONFIG.runaway.steps.toLocaleString()} 步才能找回來`,5000);sfx('no')},300)}}if(r.warn==='back'&&!clockWarned){clockWarned=true;toast('⚠️ 裝置時間好像倒退了，遊戲不會回溯進度',4000)}
 if(r.warn==='jump')toast('⚠️ 離開很久了：離線變化最多只計算 12 小時',4000)}
function tick(){const r=PC.applyTime(s,Date.now());handleTime(r);return r}

/* =========================================================
   像素繪圖核心：grid → 自動描邊 → ImageData
   ========================================================= */
function grid(w,h){return{w,h,a:new Array(w*h).fill(0)}}
function px(g,x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<g.w&&y<g.h)g.a[y*g.w+x]=c}
function get(g,x,y){return x>=0&&y>=0&&x<g.w&&y<g.h?g.a[y*g.w+x]:0}
function ellipse(g,cx,cy,rx,ry,fn){
 for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
  const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry;if(nx*nx+ny*ny<=1){const c=fn(x,y,nx,ny);if(c)px(g,x,y,c)}}}
function outline(g,col){const b=g.a.slice();for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){if(b[y*g.w+x])continue;
 if((x>0&&b[y*g.w+x-1])||(x<g.w-1&&b[y*g.w+x+1])||(y>0&&b[(y-1)*g.w+x])||(y<g.h-1&&b[(y+1)*g.w+x]))g.a[y*g.w+x]=col}}
// 場景用的外框：取旁邊那格的顏色再加深（不是黑線），背景物件看起來一致、柔和；幻獸和球維持黑框才會跳出來
function outlineSelf(g,k=.55){const b=g.a.slice(),W=g.w,H=g.h;for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(b[y*W+x])continue;
 const n=[x>0&&b[y*W+x-1],x<W-1&&b[y*W+x+1],y>0&&b[(y-1)*W+x],y<H-1&&b[(y+1)*W+x]].filter(Boolean);if(!n.length)continue;
 let best=null,bl=1e9;for(const c of n){if(c[0]!=='#')continue;const[r,gg,bb]=rgb(c),l=r+gg+bb;if(l<bl){bl=l;best=[r,gg,bb]}}if(!best)continue;
 g.a[y*W+x]='#'+best.map(v=>Math.round(v*k).toString(16).padStart(2,'0')).join('')}}
const rgbCache={};
function rgb(h){if(rgbCache[h])return rgbCache[h];const n=parseInt(h.slice(1),16);return rgbCache[h]=[n>>16&255,n>>8&255,n&255]}
function blit(g,img,ox,oy=0){for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){const c=g.a[y*g.w+x];if(!c)continue;
 const i=((oy+y)*img.width+ox+x)*4,[r,gg,b]=rgb(c);img.data[i]=r;img.data[i+1]=gg;img.data[i+2]=b;img.data[i+3]=255}}
function gridCanvas(g){const cv=document.createElement('canvas');cv.width=g.w;cv.height=g.h;const ctx=cv.getContext('2d');const img=ctx.createImageData(g.w,g.h);blit(g,img,0);ctx.putImageData(img,0,0);return cv}

function drawCreature(F,fr){

 if(F.tail==='fin'){for(let r=0;r<5;r++)for(let x=0;x<=r+1;x++)px(g,tx+2+x,ty-3+r,x%2?P.accD:P.acc)}

 if(F.tail==='feather'){for(let k=0;k<3;k++){const ox=tx+2+k*2,oy=ty-4+k;for(let j=0;j<4;j++){px(g,ox+j,oy-j+k,j===0?P.accD:P.acc)}}px(g,tx+2,ty-1,P.accD)}

 if(has('pat-spots'))[[-8,-3],[6,-5],[-5,-7],[8,2],[-9,3]].forEach(([ox,oy])=>{for(const[a,b]of[[0,0],[1,0],[0,1],[1,1]])pp(cxi+ox+a,Math.round(cy)+oy+b,P.pat)});

 if(has('crest')){rect(cxi-2,top,4,P.accD);rect(cxi-2,top-1,4,P.acc);rect(cxi-1,top-2,2,P.acc);px(g,cxi-1,top-3,P.acc);px(g,cxi,top-1,'#fff6c8')}

  [[-6,-3,2],[-6,-2,4],[-5,-1,5],[-4,0,5],[-2,1,3]].forEach(([ox,oy,w])=>{for(let i=0;i<w;i++)pm(lx+ox+i,y0+oy,(lx+ox+i)%2?P.accD:P.acc)})}

 if(has('leaves')){const bx=cxi-8;[[0,0,3],[-1,-1,4],[-2,-2,4],[-3,-3,4],[-3,-4,3],[-4,-5,2],[-4,-6,1]].forEach(([ox,oy,w],i)=>{for(let k=0;k<w;k++)pm(bx+ox+k,top+1+oy,k===1&&i>0&&i<6?P.accD:P.acc)})}
 if(has('ears')){const bx=cxi-10;[[0,0,5],[0,-1,4],[1,-2,3],[1,-3,2],[2,-4,1]].forEach(([ox,oy,w],i)=>{for(let k=0;k<w;k++)pm(bx+ox+k,top+2+oy,k>0&&k<w-1&&i<3?P.acc:(k===0?P.d:P.b))})}
 if(has('bunny')){for(let k=0;k<9;k++){const x=cxi-8-Math.floor(k/4);for(let w=0;w<3;w++)pm(x+w,top+1-k,w===1&&k>0&&k<8?P.acc:(w===0?P.d:P.b))}}
 if(has('tuft')){rect(cxi-1,top,2,P.l);rect(cxi-1,top-1,2,P.l);px(g,cxi-2,top-2,P.l);px(g,cxi+1,top-2,P.l);px(g,cxi,top-3,P.l);px(g,cxi-1,top-1,P.b)}
 if(has('rockcrest')){for(const[ox,w,hh]of[[-4,3,2],[1,4,3]]){for(let j=0;j<hh;j++)rect(cxi+ox-1,top-j,w,j===0?P.accD:P.acc)}px(g,cxi,top-2,'#e8d8c0')}

function quizResult(ans){const cnt={},sc={},U=PC.unplayedRoutes(s);for(const[,ops]of QUIZ)for(const[,e]of ops)cnt[e]=(cnt[e]||0)+1;
 ans.forEach((a,i)=>{const e=QUIZ[i][1][a][1];sc[e]=(sc[e]||0)+1});
 const all=Object.keys(cnt).map(e=>[e,(sc[e]||0)/cnt[e]+Math.random()*1e-6]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]),rank=all.filter(e=>U.includes(e));   // 玩過的屬性不會再抽到
 const r=Math.random(),pick=rank.length<2?rank[0]:r<.7?rank[0]:r<.9||rank.length<3?rank[1]:rank[2+Math.floor(Math.random()*(rank.length-2))];return{top:all[0],pick,rank}}
function seedFor(el){for(let i=0;i<500;i++){const sd=crypto.getRandomValues(new Uint32Array(1))[0];if(PC.genomeOfSeed(sd).el===el)return sd}return null}

function quizStep(ans){const i=ans.length;if(i>=QUIZ.length){quizDone(ans);return}const[q,ops]=QUIZ[i];
 openModal(`🔮 ${i+1} / ${QUIZ.length}`,`<div class="xpbar" style="margin:2px 0 12px"><i style="width:${i/QUIZ.length*100}%"></i></div><p style="font-size:17px"><b>${q}</b></p>

function checksum(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h.toString(36)}
function exportCode(){const b64=btoa(unescape(encodeURIComponent(JSON.stringify({app:'pixel-familiar',ver:VERSION,at:Date.now(),save:s}))));return'PF1.'+b64+'.'+checksum(b64)}
function decodeCode(code){code=String(code||'').replace(/\s+/g,'');
 if(code.startsWith('{')){const o=parse(code);return o&&(o.save||o)}
 const m=/^PF1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/.exec(code);if(!m)throw new Error('格式不正確');if(checksum(m[1])!==m[2])throw new Error('存檔碼不完整或被修改過');
 const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o||o.app!=='pixel-familiar'||!o.save)throw new Error('這不是幻獸日記的存檔');return o.save}
function fmtTime(t){if(!t)return'從未';const d=new Date(t);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

 $('bFile').onclick=async()=>{const code=exportCode(),name=`pixel-familiar-${new Date().toISOString().slice(0,10)}.txt`;s.lastExport=Date.now();save();

  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('已下載存檔檔案')};

/* 危險判斷：敵人下一擊（用牠最強的招式估算）可能把我打倒 */

function aiMove(f){const me=B&&B.me;   // 野生怪會看情況出招：能打倒你就全力攻擊、快倒時防禦、偶爾蓄力
 if(me&&f.cd===0&&PC.expectDamage(f,me,true)>=me.hp)return'special';if(me&&PC.expectDamage(f,me,false)>=me.hp)return'tackle';
 if(f.hp<f.max*.3&&Math.random()<.4)return'guard';if(!f.charged&&f.hp>f.max*.4&&Math.random()<.22)return'charge';if(f.cd===0&&Math.random()<.65)return'special';return'tackle'}

   btn(){G.n++;G.hopT=0;G.sw=Math.min(1.3,G.sw+.3);G.dir=-(G.dir||1);sfx(G.n%4===0?'crack':'tap');buzz(6);tPop(G.n%3?'spark':'star',86,56+Math.random()*16,G.n%5===0?3:1);if(G.n%7===0)G.shake=.12},tap(){G.btn()},
   hud(){return`👊 <b>${G.n}</b> / 28　⏱ ${Math.max(0,2-G.t).toFixed(1)} 秒`},
   update(dt){G.hopT+=dt;G.sw*=Math.pow(.08,dt);if(G.t>=2)endTraining(G.n>=28,`2 秒撞了 ${G.n} 下！`)},
   draw(c,now){tGym(c);const a=G.sw*.45*Math.sin(now/55);c.save();c.translate(94,0);c.rotate(a);c.fillStyle='#4a3a2a';c.fillRect(-1,0,2,22);c.fillStyle='#2a170a';c.fillRect(-10,21,20,42);c.fillStyle='#c8503a';c.fillRect(-9,22,18,40);c.fillStyle='#e8806a';c.fillRect(-9,22,4,40);c.fillStyle='#8a2a1a';c.fillRect(-9,40,18,2);
    if(G.hopT<.12){c.fillStyle='#ffffff';c.fillRect(-11,44,3,1);c.fillRect(-12,48,4,1);c.fillRect(-11,52,3,1)}c.restore();   // 被撞到的衝擊線
    const k=Math.min(1,G.hopT/.16),hop=G.phase==='play'&&k<1,dx=hop?24*Math.sin(Math.PI*k):0,dy=hop?-10*Math.sin(Math.PI*k):Math.abs(Math.sin(now/180))*-2;   // 跳過去撞、再彈回來；沒在撞的時候原地小跳
    const fr=G.phase==='done'?(G.win?'happy0':'sad0'):hop?(k<.5?'jump1':'happy0'):Math.floor(now/1400)%4===3&&now%1400<160?'blink':['idle0','jump0'][Math.floor(now/180)%2];
    tPet(c,fr,24+dx,58+dy,true);if(hop&&k>.35&&k<.65){c.fillStyle='#fff3a6';c.fillRect(70,60,3,3);c.fillRect(74,54,2,2);c.fillRect(74,66,2,2)}
    tBar(c,8,104,112,G.n/28,G.n>=28?'#6fcf5a':'#ffd34a')}})},
 /* 組合拳：3 秒內照順序打完隨機 5～6 拳 */
 combo(G){const SEQ=comboSeq();Object.assign(G,{seq:SEQ,i:0,side:0,hit:0,btns:[['L','👊 左'],['R','右 👊']],
   btn(b){if(b===SEQ[G.i]){G.i++;G.side=b==='L'?-1:1;G.hit=performance.now()+120;sfx('tap');buzz(8);tPop('spark',92+G.side*4,46,2);if(G.i>=SEQ.length)endTraining(true,`${G.t.toFixed(2)} 秒打完一套 ${SEQ.length} 連擊組合拳！`)}else{G.i=0;G.shake=.25;sfx('no');tMsg('按錯了！從頭來')}},
   tap(x){G.btn(x<64?'L':'R')},
   hud(){return SEQ.map((k,j)=>`<span class="cmb ${j<G.i?'ok':''}">${k==='L'?'左':'右'}</span>`).join('')+`　⏱ ${Math.max(0,3-G.t).toFixed(1)}`},
   update(){if(G.t>=3)endTraining(false,`時間到，打到第 ${G.i} 拳`)},
   draw(c,now){tGym(c);const a=G.hit>now?G.side*.35:0;c.save();c.translate(94,0);c.rotate(a);c.fillStyle='#4a3a2a';c.fillRect(-1,0,2,22);c.fillStyle='#2a170a';c.fillRect(-10,21,20,42);c.fillStyle='#3a6ac8';c.fillRect(-9,22,18,40);c.fillStyle='#7a9af0';c.fillRect(-9,22,4,40);c.restore();
    tPet(c,G.phase==='done'?(G.win?'happy0':'sad0'):G.hit>now?'jump0':'idle0',38,58,true);tBar(c,8,104,112,1-G.t/3,'#ffd34a')}})},
 /* 靈光一閃：飛盤進紅色範圍時點 */
 flash(G){const ZX=[77,89],EL=PC.ELEM[s.route]||'none',IC=(typeof SP_ICON!=='undefined'&&SP_ICON[EL])||'star',FXE=TRAIN_FX[EL]||TRAIN_FX.none;Object.assign(G,{n:0,hits:0,miss:0,f:null,next:.6,shots:[],
   tap(){const f=G.f;if(!f||f.tapped)return;f.tapped=true;const ok=f.x>=ZX[0]&&f.x<=ZX[1];G.shots.push({x0:62,y0:70,x1:f.x,y1:f.y,t:0,ok});G.atk=performance.now()+300;sfx(FXE.snd);   // 用屬性技從遠處射出去
    if(ok){G.hits++;f.hit=true;f.hitAt=G.t}else{G.miss++;sfx('no');tMsg(f.x<ZX[0]?'太早了！':'太晚了！')}},
   hud(){return`💡 打中 <b>${G.hits}</b> / 3　（飛盤 ${Math.min(5,G.n)}/5）`},
   update(dt){for(let i=G.shots.length-1;i>=0;i--){const sh=G.shots[i];sh.t+=dt/.14;if(sh.t>=1){G.shots.splice(i,1);if(sh.ok){tPop(IC,sh.x1,sh.y1,6);tPop('star',sh.x1,sh.y1,3);G.boom={x:sh.x1,y:sh.y1,t:0};sfx('boom');buzz(35);G.shake=.2;tMsg(`${FXE.nm}射中了！靈光一閃！`)}else G.boom={x:sh.x1,y:sh.y1,t:0,miss:1}}}
    if(G.boom){G.boom.t+=dt;if(G.boom.t>.45)G.boom=null}
    const f=G.f;if(f){if(!f.hit){f.chg-=dt;if(f.chg<=0){f.chg=.25+Math.random()*.45;f.tvy=(Math.random()-.5)*130;f.tsp=f.base*(.55+Math.random()*1.1)}   // 亂飛：一下快一下慢、上下亂飄
      f.vy+=(f.tvy-f.vy)*Math.min(1,dt*6);f.sp+=(f.tsp-f.sp)*Math.min(1,dt*5);f.x+=f.sp*dt;f.y+=f.vy*dt;if(f.y<14){f.y=14;f.tvy=Math.abs(f.tvy)}if(f.y>64){f.y=64;f.tvy=-Math.abs(f.tvy)}}
     if(f.x>140||(f.hit&&G.t-f.hitAt>.35)){if(!f.tapped){G.miss++;tMsg('錯過了…')}G.f=null;G.next=G.t+.5+Math.random()*.9;if(G.hits>=3){endTraining(true,`5 個飛盤射中 ${G.hits} 個！`);return}if(G.n>=5){endTraining(false,`只射中 ${G.hits} 個…`);return}}}
    else if(G.t>=G.next){if(G.hits>=3||G.n>=5)return;G.n++;const base=70+G.n*12;G.f={x:-8,y:22+Math.random()*34,vy:0,tvy:0,base,sp:base,tsp:base,chg:0}}},
   draw(c,now){tGym(c);c.fillStyle='rgba(232,67,63,.22)';c.fillRect(ZX[0],0,ZX[1]-ZX[0],72);c.fillStyle='#e8433f';for(let y=0;y<72;y+=6){c.fillRect(ZX[0],y,1,3);c.fillRect(ZX[1],y,1,3)}
    tPet(c,G.phase==='done'?(G.win?'happy0':'sad0'):G.atk>now?'jump1':['idle0','idle1'][Math.floor(now/400)%2],30,58,true);
    for(const sh of G.shots)drawShot(c,sh,FXE,IC,now);
    if(G.boom){const b=G.boom,k=b.t/.45,r=4+k*(b.miss?8:20);c.save();c.globalCompositeOperation='lighter';c.globalAlpha=1-k;c.strokeStyle=FXE.c1;c.lineWidth=3;c.beginPath();c.arc(b.x,b.y,r,0,Math.PI*2);c.stroke();c.fillStyle=FXE.c2;c.beginPath();c.arc(b.x,b.y,r*.55,0,Math.PI*2);c.fill();if(!b.miss&&k<.25){c.fillStyle=FXE.c1;c.globalAlpha=.25;c.fillRect(0,0,128,112)}c.restore()}
    const f=G.f;if(f&&!f.hit){const x=Math.round(f.x),y=Math.round(f.y),tl=Math.max(-1,Math.min(1,f.vy/60));c.fillStyle='#2a170a';c.fillRect(x-6,y-2+(tl>0?1:0),12,5);c.fillStyle='#ffd34a';c.fillRect(x-5,y-1,10,3);c.fillStyle='#fff3a6';c.fillRect(x-3,y-1,6,1);c.fillStyle='#e8433f';c.fillRect(x-1,y,2,1)}}})},
 /* 瀑布打坐：坐在瀑布正下方，點掉亂飄的意念泡泡 */
 zen(G){const POOL=['apple','berry','note','fish','meat','cake','banana','melonw','dragon','potato','nut','coconut','candy','coin','bone','star','heart','seed','potion','cranberry','blueberry','strawberry','ball','moon','sun','leaf','fire','bolt'].filter(k=>ICV[k]);let bag=[];
  const nextIc=()=>{if(!bag.length){bag=POOL.slice();for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()};   // 洗牌輪流出，不會一直重複
  const S=G.S,fi=S.idx.sleep0??S.idx.idle0??0;let top=48;try{const d=S.cv.getContext('2d').getImageData(fi*CELL,0,CELL,CELL).data;for(let y=0;y<CELL&&top===48;y++)for(let x=0;x<CELL;x++)if(d[(y*CELL+x)*4+3]>0){top=y;break}}catch(e){top=10}
  Object.assign(G,{bubs:[],esc:0,popped:0,next:.3,drops:[],headY:52+top,
   tap(x,y){for(let i=G.bubs.length-1;i>=0;i--){const b=G.bubs[i];if(Math.hypot(x-b.x,y-b.y)<11){G.bubs.splice(i,1);G.popped++;tPop('heart',b.x,b.y,1);for(let k=0;k<6;k++)G.drops.push({x:b.x,y:b.y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,t:0,life:.35});sfx('tap');buzz(6);return}}},
   hud(){return`🫧 點掉 ${G.popped}　💭 分心 ${G.esc}/3　⏱ ${Math.max(0,20-G.t).toFixed(0)} 秒`},
   update(dt){if(G.t>=G.next&&G.t<19){G.bubs.push({x:14+Math.random()*100,y:116,vy:(Math.random()<.4?64+Math.random()*26:36+Math.random()*20)+G.t*1.4,vx:0,dart:.2+Math.random()*.4,ic:nextIc()});G.next=G.t+Math.max(.4,.8-G.t*.02)+Math.random()*.25}
    for(let i=G.bubs.length-1;i>=0;i--){const b=G.bubs[i];b.dart-=dt;if(b.dart<=0){b.dart=.25+Math.random()*.45;b.vx=(Math.random()<.5?-1:1)*(30+Math.random()*50)}   // 左右亂閃
     b.y-=b.vy*dt;b.x+=b.vx*dt;if(b.x<10){b.x=10;b.vx=Math.abs(b.vx)}if(b.x>118){b.x=118;b.vx=-Math.abs(b.vx)}
     if(b.y<-8){G.bubs.splice(i,1);G.esc++;G.shake=.25;sfx('no');tMsg('分心了！');if(G.esc>3){endTraining(false,'雜念太多，分心了…');return}}}
    for(let k=0;k<4;k++){const sd=Math.random()<.5?-1:1;G.drops.push({x:64+sd*(2+Math.random()*8),y:G.headY+Math.random()*3,vx:sd*(25+Math.random()*45),vy:-(15+Math.random()*35),g:240,t:0,life:.55})}   // 瀑布打在頭上濺開
    for(let i=G.drops.length-1;i>=0;i--){const d=G.drops[i];d.t+=dt;if(d.t>d.life){G.drops.splice(i,1);continue}d.vy+=(d.g||0)*dt;d.x+=d.vx*dt;d.y+=d.vy*dt}
    if(G.t>=20&&!G.bubs.length)endTraining(true,`點掉 ${G.popped} 個念頭，心如止水！`);else if(G.t>=21)endTraining(G.esc<=3,'時間到')},
   draw(c,now){tFall(c,now);tPet(c,G.phase==='done'&&!G.win?'sad0':'sleep0',40,52);
    const ts=now/1000;c.fillStyle='rgba(225,245,255,.75)';c.fillRect(52,0,24,G.headY+2);c.fillStyle='rgba(160,215,250,.8)';for(let i=0;i<6;i++){const x=53+i*4,y=((ts*140+i*29)%(G.headY+20))-18;c.fillRect(x,Math.max(0,y),2,Math.min(16,G.headY+2-Math.max(0,y)))}   // 瀑布直接打在頭上
    c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(64,G.headY+2,16+Math.sin(ts*9)*2,5,0,0,Math.PI*2);c.fill();   // 水花霧氣
    for(const d of G.drops){c.fillStyle=d.t<.2?'#ffffff':'#bfe8ff';c.fillRect(Math.round(d.x),Math.round(d.y),2,2)}
    for(const b of G.bubs){const x=Math.round(b.x),y=Math.round(b.y);c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(x,y,9,0,Math.PI*2);c.fill();c.strokeStyle='#ffffff';c.lineWidth=1;c.beginPath();c.arc(x+.5,y+.5,9,0,Math.PI*2);c.stroke();c.fillStyle='#ffffff';c.fillRect(x-5,y-6,2,2);
     const ic=ICV[b.ic];if(ic)c.drawImage(ic,Math.round(x-ic.width/2),Math.round(y-ic.height/2))}}})}};
