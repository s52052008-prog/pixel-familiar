<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>幻獸日記・裝飾調整器</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#2a1a0e;color:#fff3d8;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto;padding:0 10px 30px}
.top{display:flex;align-items:center;gap:8px;padding:10px 0 6px}.top h1{font-size:17px;margin:0;flex:1}
.pill{font-size:11px;background:#4a301a;border-radius:20px;padding:4px 9px;color:#f0d8a8;max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.scr::-webkit-scrollbar{display:none}
.chip{flex:none;background:#5a3a20;border:2px solid #2a170a;color:#fff3d8;border-radius:20px;padding:6px 12px;font-size:14px;white-space:nowrap}.chip.on{background:#ffe066;color:#3a2414;border-color:#b8854e;font-weight:700}
.th{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:#4a301a;border:2px solid #2a170a;border-radius:10px;padding:3px;font-size:11px;color:#f0d8a8}
.th canvas{width:58px;height:58px;image-rendering:pixelated}.th.on{background:#ffe066;color:#3a2414;border-color:#b8854e}.th img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated;margin:9px}
.stage{position:sticky;top:0;z-index:5;background:#2a1a0e;padding:4px 0 6px;box-shadow:0 6px 10px -6px #000}
.cvw{position:relative;width:min(100%,44vh);margin:0 auto}
#cv{width:100%;aspect-ratio:1;image-rendering:pixelated;background:#77a877;border:3px solid #2a170a;border-radius:10px;display:block;touch-action:none}
.cvb{position:absolute;top:6px;display:flex;gap:5px}.cvb.l{left:6px}.cvb.r{right:6px}.cvb button{background:#2a170acc;border:none;color:#fff;border-radius:8px;padding:5px 8px;font-size:13px}.cvb button.off{opacity:.5}
#hint{text-align:center;font-size:12px;color:#d8c0a0;margin:4px 0 0;min-height:16px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;background:#1a0f06;border-radius:12px;padding:4px}
.seg button{background:none;border:none;color:#d8c0a0;border-radius:9px;padding:8px 2px;font-size:13px;line-height:1.2}.seg button b{display:block;font-size:18px}.seg button.on{background:#ffe066;color:#3a2414;font-weight:700}
.panel{background:#3a2414;border-radius:12px;padding:10px;margin-top:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px;flex:none}
.dpad button,.btn{background:#8a5a34;border:2px solid #2a170a;color:#fff;border-radius:10px;font-size:18px;padding:0}
.dpad button:active,.btn:active,.chip:active{transform:scale(.94)}
.dpad .go{background:#ffe066;color:#3a2414;font-size:13px;font-weight:700}
.side{display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px}
.lab{font-size:12px;color:#f0d8a8;margin-bottom:3px}
.pm{display:flex;gap:4px}.pm .btn{flex:1;height:40px;font-size:15px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#1a0f06;border-radius:10px;padding:3px}.seg3 button{background:none;border:none;color:#d8c0a0;border-radius:8px;padding:8px 0;font-size:13px}.seg3 button.on{background:#ffe066;color:#3a2414;font-weight:700}
.reset{background:none;border:1px dashed #8a6a4a;color:#d8c0a0;border-radius:8px;padding:7px;font-size:12px;width:100%}
.sw{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:3px 0 8px}.sw button{aspect-ratio:1;border:2px solid #2a170a;border-radius:6px;padding:0}.sw button.on{outline:3px solid #ffe066;outline-offset:1px}
.colr{display:flex;align-items:center;gap:10px;margin:8px 0}#curC{width:40px;height:40px;border:3px solid #fff3d8;border-radius:10px;flex:none}input[type=color]{width:46px;height:40px;border:none;background:none;padding:0}
.note{font-size:12px;color:#d8c0a0;text-align:center;margin-top:6px}
.foot{margin-top:14px}.big{width:100%;background:#ffe066;color:#3a2414;border:3px solid #2a170a;border-radius:12px;padding:12px;font-size:16px;font-weight:700}
textarea{width:100%;height:70px;font-size:11px;border-radius:8px;margin-top:6px}details{margin-top:8px;font-size:13px;color:#d8c0a0}
.dpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;max-height:170px;overflow-y:auto;background:#1a0f06;border-radius:10px;padding:5px;margin:4px 0 8px}.dpick button{position:relative;aspect-ratio:1;background:#77a877;border:2px solid transparent;border-radius:6px;padding:2px}.dpick button.on{border-color:#ffe066}.dpick img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.dpick i{position:absolute;right:1px;top:-2px;font-style:normal;font-size:11px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:8px}#grid canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;background:#77a877;border-radius:4px;border:2px solid transparent}#grid canvas.on{border-color:#ffe066}
</style></head><body><div class="wrap">
<div class="top"><h1>🎀 裝飾調整器</h1><div class="pill" id="cloud">☁️ 連線中…</div></div>
<div class="scr" id="cEl"></div>
<div class="scr" id="cSt"></div>
<div class="scr" id="cAc"></div>
<div class="stage">
 <div class="cvw"><canvas id="cv" width="240" height="240"></canvas>
  <div class="cvb l"><button id="bUndo">↩️ 上一步</button></div>
  <div class="cvb r"><button id="bZo" class="zb">🔍－</button><button id="bZi" class="zb">🔍＋</button><button id="bFace">↔️ 轉向</button><button id="bGuide">📐 線</button></div></div>
 <div id="hint"></div>
 <div class="seg" id="modes"><button data-mode="acc"><b>🎀</b>裝飾位置</button><button data-mode="head"><b>🧠</b>頭型</button><button data-mode="mouth"><b>👄</b>嘴巴</button><button data-mode="draw"><b>🖌️</b>修圖</button></div>
</div>

<div class="panel" id="p-acc">
 <div class="row"><div class="dpad"><span></span><button data-mv="0,-1">▲</button><span></span><button data-mv="-1,0">◀</button><button class="go" disabled>移動</button><button data-mv="1,0">▶</button><span></span><button data-mv="0,1">▼</button><span></span></div>
 <div class="side"><div><div class="lab">大小</div><div class="pm"><button class="btn" data-sz="-1">－ 縮小</button><button class="btn" data-sz="1">＋ 放大</button></div></div>
  <div><div class="lab">歪一邊</div><div class="pm"><button class="btn" data-rot="-5">↺</button><button class="btn" data-rot="0" style="font-size:13px">擺正</button><button class="btn" data-rot="5">↻</button></div></div></div></div>
 <div class="lab" style="margin-top:10px">圖層（被頭擋住的程度）</div><div class="seg3" id="layer"><button data-ly="0">預設</button><button data-ly="1">整個在前面</button><button data-ly="-1">整個在後面</button></div>
 <div class="lab" style="margin-top:10px">上下分界（這件裝飾、全部寵物一起；粉紅虛線以上在後、以下在前）</div><div class="pm"><button class="btn" data-sp="0.04">▲ 線往上</button><button class="btn" data-sp="-0.04">▼ 線往下</button><button class="btn" data-sp="r" style="font-size:13px">恢復原本</button></div>
 <div class="note" style="text-align:left">像花圈、圍巾：上半繞到頭／身體後面，下半蓋在前面。上面的「圖層」是只改這一隻。</div>
 <button class="reset" style="margin-top:10px" data-reset="acc">這隻的這個裝飾重設</button>
</div>

<div class="panel" id="p-head">
 <div class="note" style="margin:0 0 8px">調「這隻的頭」→ 牠戴的所有帽子會一起跟著動</div>
 <div class="row"><div class="dpad"><span></span><button data-hd="ht,-1">▲</button><span></span><button data-hd="cx,-1">◀</button><button class="go" disabled>頭頂</button><button data-hd="cx,1">▶</button><span></span><button data-hd="ht,1">▼</button><span></span></div>
 <div class="side"><div><div class="lab">頭的寬度</div><div class="pm"><button class="btn" data-hd="hw,-1">－</button><button class="btn" data-hd="hw,1">＋</button></div></div>
  <div><div class="lab">眼睛高度（墨鏡）</div><div class="pm"><button class="btn" data-hd="ey,-1">▲</button><button class="btn" data-hd="ey,1">▼</button></div></div>
  <div><div class="lab">兩眼距離</div><div class="pm"><button class="btn" data-hd="ew,-1">－</button><button class="btn" data-hd="ew,1">＋</button></div></div></div></div>
 <button class="reset" style="margin-top:10px" data-reset="head">這隻的頭型重設</button>
</div>

<div class="panel" id="p-mouth">
 <div class="note" style="margin:0 0 8px">吐彩虹時張嘴的位置（雪茄也會跟著）</div>
 <div class="row"><div class="dpad"><span></span><button data-mo="my,-1">▲</button><span></span><button data-mo="mx,-1">◀</button><button class="go" disabled>嘴巴</button><button data-mo="mx,1">▶</button><span></span><button data-mo="my,1">▼</button><span></span></div></div>
 <button class="reset" style="margin-top:10px" data-reset="mouth">這隻的嘴巴重設</button>
</div>

<div class="panel" id="p-draw">
 <div class="lab">要修哪一種素材</div><div class="scr" id="dCat" style="padding-top:0"></div>
 <div id="dPickWrap" style="display:none"><div class="dpick" id="dPick"></div></div>
 <div class="seg3" id="tool"><button data-tool="pen">✏️ 畫筆</button><button data-tool="pick">💧 吸色</button><button data-tool="erase">🧽 橡皮擦</button></div>
 <div class="row" style="margin-top:10px"><div class="dpad"><button data-dm="-1,-1">↖</button><button data-dm="0,-1">▲</button><button data-dm="1,-1">↗</button><button data-dm="-1,0">◀</button><button class="go" id="dGo">👆<br>點下去</button><button data-dm="1,0">▶</button><button data-dm="-1,1">↙</button><button data-dm="0,1">▼</button><button data-dm="1,1">↘</button></div>
 <div class="side"><div><div class="lab">手指在畫面上</div><div class="seg3" id="touch"><button data-tc="move">移框框</button><button data-tc="paint">直接畫</button><button data-tc="pan">✋拖畫面</button></div></div>
  <div id="eyesWrap"><div class="lab">要改哪一張</div><div class="seg3" id="eyes"><button data-eye="o">睜眼</button><button data-eye="c">閉眼</button><button data-eye="b">兩張</button></div></div></div></div>
 <div class="colr"><div id="curC"></div><div style="flex:1"><div class="lab">目前顏色 <b id="curHex"></b></div><div class="small" style="font-size:11px;color:#d8c0a0">點右邊色塊開大色盤 →</div></div><input type="color" id="dCol"></div>
 <div class="lab">這隻身上的顏色</div><div class="sw" id="swPet"></div>
 <div class="lab">常用色</div><div class="sw" id="swBase"></div>
 <div class="lab">最近用過</div><div class="sw" id="swRecent"></div>
 <button class="reset" data-reset="draw">這張圖改過的地方全部還原</button>
</div>

<div class="foot">
 <details><summary>👀 看全部 35 隻戴起來的樣子</summary><div id="grid"></div></details>
 <details><summary>📋 手動備份／還原設定</summary><button class="big" id="bCopy" style="margin-top:8px">複製設定</button><textarea id="out" readonly></textarea><textarea id="inp" placeholder="貼上之前的設定"></textarea><button class="chip" id="bLoad" style="margin-top:6px">載入</button></details>
</div>
