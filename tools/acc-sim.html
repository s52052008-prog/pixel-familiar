<h1>🎀 幻獸日記・裝飾調整器</h1>
<div class="small">選幻獸、選裝飾，用按鈕調到你覺得剛好（也可以調吐彩虹的嘴巴位置），最後按「複製設定」貼給 Claude。會自動存在這支手機。</div>
<div class="lbl">屬性</div><div class="chips" id="cEl"></div>
<div class="lbl">階段</div><div class="chips" id="cSt"></div>
<div class="lbl">裝飾</div><div class="chips" id="cAc"></div>
<canvas id="cv" width="240" height="240"></canvas>
<div class="chips"><button class="chip" id="bGuide">輔助線：開</button><button class="chip" id="bFace">朝向：左</button></div>
<div class="tabs"><button class="chip on" id="tHead">🧠 調頭型（這隻的全部裝飾一起動）</button><button class="chip" id="tOne">🎯 只調這個裝飾</button></div>
<div id="pHead"><div class="lbl">頭頂（帽子坐的地方）</div><div class="pad"><button data-h="ht,-1">▲ 往上</button><button data-h="ht,1">▼ 往下</button><button data-h="cx,-1">◀ 中心往左</button><button data-h="cx,1">▶ 中心往右</button></div>
<div class="lbl">頭的大小、眼睛</div><div class="pad"><button data-h="hw,1">頭寬 ＋</button><button data-h="hw,-1">頭寬 −</button><button data-h="ey,-1">眼睛 ▲</button><button data-h="ey,1">眼睛 ▼</button><button data-h="ew,1">眼距 ＋</button><button data-h="ew,-1">眼距 −</button><button data-h="reset">這隻重設</button></div>

<div id="pOne" style="display:none"><div class="lbl">只動「這隻 × 這個裝飾」</div><div class="pad"><button data-o="0,-1">◀ 左</button><button data-o="0,1">▶ 右</button><button data-o="1,-1">▲ 上</button><button data-o="1,1">▼ 下</button><button data-o="2,1">放大</button><button data-o="2,-1">縮小</button><button data-o="reset">重設</button></div>
<div class="lbl">圖層、歪一邊</div><div class="pad"><button data-o="L">🔼 圖層切換</button><button data-o="4,-5">↺ 往左歪</button><button data-o="4,5">↻ 往右歪</button><button data-o="4,0">擺正</button></div>

function anchor(k){const T=TAB[k];return{ht:T.ht,cx:T.cx,hw:T.hw,ey:T.ey,ex0:T.cx-T.ew/2,ex1:T.cx+T.ew/2,ny:T.ey+(T.ey-T.ht)*.95+1,mouth:T.ey+Math.max(3,(T.ey-T.ht)*.45)+(T.my||0),mcx:T.cx+(T.mx||0),bot:45}}
function drawAcc(c,k,x,y,w,fl,list,layer){const A=anchor(k),s=w/CELL;for(const id of list){const it=ACC[id],im=it&&IMG[it.img];if(!im)continue;const F=(FIX[k]&&FIX[k][id])||[0,0,0,0,0],fr=F[3]===1?1:F[3]===-1?0:(it.front??1);if(layer==='back'&&fr>=1)continue;if(layer==='front'&&fr<=0)continue;

 if(it.slot==='head'){aw=A.hw*it.w;cx=A.cx+(it.side||0)*A.hw+(it.dx||0)*aw;const ah0=im.height*(aw/im.width);by=Math.min(A.ht+ah0*it.sink,A.ey-(it.side?0:2))}
 else if(it.slot==='face'){aw=Math.max(A.ex1-A.ex0+5,A.hw*.62);cx=A.cx;by=A.ey+im.height*(aw/im.width)*.55}

function drawMouth(c,k,x,y,s,fl){const A=anchor(k),mx=fl?CELL-A.mcx:A.mcx,ox=Math.round(mx)-2,oy=Math.round(A.mouth+1)-2,P=(a,b,w,h,col)=>{c.fillStyle=col;c.fillRect(x+a*s,y+b*s,w*s,h*s)};P(ox,oy,5,4,'#2a0a0a');P(ox+1,oy-1,3,6,'#2a0a0a');P(ox+1,oy,3,3,'#7a1a2a');P(ox+1,oy+2,3,1,'#e8607a')}
